# Generated into RingPromoterMac.xcodeproj by `xcodegen`. Edit this, never the
# .xcodeproj — it is git-ignored and rebuilt from here.
#
# The iOS project (../ios/RingPromoter.xcodeproj) is hand-maintained and is
# deliberately NOT generated: regenerating it would discard signing, the widget
# extension and the Live Activity configuration. This spec only reads from it.
name: RingPromoterMac

options:
  bundleIdPrefix: org.fictionally
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic

targets:
  RingPromoterMac:
    type: application
    platform: macOS
    info:
      path: Config/RingPromoterMac-Info.plist
      properties:
        CFBundleName: Ring Promoter
        CFBundleDisplayName: Ring Promoter
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: org.fictionally.ringpromoter.deeplink
            CFBundleURLSchemes: [ringpromoter]
    entitlements:
      path: Config/RingPromoterMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fictionally.ringpromoter
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    sources:
      # Mac-only: the app entry point, the sidebar shell, and the shims that
      # let the shared iOS views compile here.
      - path: RingPromoterMac

      # The shared app. Everything below is the SAME source the iOS app ships,
      # read in place — there is no copy to drift.
      - path: ../ios/RingPromoter
        excludes:
          # Replaced by RingPromoterMacApp.swift: @main can exist once, and
          # @UIApplicationDelegateAdaptor has no macOS equivalent.
          - "App/RingPromoterApp.swift"
          # UIApplicationDelegate / UNUserNotificationCenterDelegate. Only ever
          # referenced from the file above.
          - "App/AppDelegate.swift"
          # UIKit feedback generators. Replaced by the NSHapticFeedbackManager
          # version in Compatibility/, which keeps the same call signatures.
          - "DesignSystem/Haptics.swift"
          # ActivityKit is iPhone-only. Replaced by a no-op with an identical
          # surface so JobView compiles unchanged.
          - "Stores/LiveActivityController.swift"
          # iOS app icon sizes and an iOS AccentColor; the Mac target carries
          # its own catalogue. Fixtures are included below.
          - "Resources/Assets.xcassets"
          # SwiftUI previews only, and they pull in iOS-only preview devices.
          - "DesignSystem/ScreenPreviews.swift"
      # Shared with the widget extension on iOS. WidgetSnapshot is referenced by
      # AppSession, InstanceStore and OverviewStore, so it is app code, not
      # widget code. PromotionActivityAttributes.swift is deliberately left out:
      # it is ActivityKit, which macOS does not have.
      - path: ../ios/SharedWidget/WidgetSnapshot.swift

    resources:
      # Demo mode reads these at runtime, so they must be in the bundle.
      - path: ../ios/RingPromoter/Resources/Fixtures
      - path: RingPromoterMac/Resources/Assets.xcassets
