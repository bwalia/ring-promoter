# SwiftLint configuration for the Ring Promoter iOS app.
#
# Not installed as a build phase: the project has no third-party dependencies
# and adding a required toolchain would make a clean checkout fail to build.
# Run it yourself with `swiftlint` if you have it (`brew install swiftlint`).

included:
  - RingPromoter
  - RingPromoterWidget
  - RingPromoterTests
  - RingPromoterUITests
  - SharedWidget

excluded:
  - RingPromoter/Resources

disabled_rules:
  # SwiftUI view bodies are legitimately deep.
  - nesting
  # Trailing closures read worse for SwiftUI's multiple-closure APIs.
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 100
  error: 120
  ignores_comments: false
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 900

function_body_length:
  warning: 60
  error: 100

# SwiftUI view structs legitimately carry many @State properties.
type_name:
  min_length: 3
  max_length: 45

identifier_name:
  min_length: 2
  excluded: [id, to, at, on, up]

# No force unwraps outside tests.
force_unwrapping:
  severity: error

force_cast:
  severity: error

force_try:
  severity: error
