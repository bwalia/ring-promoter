# The Ring Promoter control-plane service.
#
# replicas is 1 by recommendation (simplest reasoning). It is not a hard
# correctness requirement with the Postgres store: promotion operations are
# serialized via a Postgres *session advisory lock*, so even an accidental
# scale-up cannot run two concurrent promotions on the same application. Do NOT
# attach an HPA. State/history live in Postgres and survive restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ring-promoter
  namespace: workstation-ring-promoter
  labels:
    app: ring-promoter
spec:
  replicas: 1
  # RollingUpdate, not Recreate. Recreate must delete EVERY old pod before it
  # creates the new one, so a pod stuck Terminating on an unreachable node
  # (kubelet gone → the deletion is never confirmed) blocks every future deploy
  # indefinitely — the rollout just waits, then CI's `rollout status` times out.
  # That is exactly what wedged this service on 2026-07-27 after node debian006
  # went NotReady. RollingUpdate instead brings the new pod up on a healthy node
  # first and only then removes the old one, so a dead node holding a ghost pod
  # can no longer stall a deploy. maxUnavailable: 0 keeps the single replica
  # serving throughout (zero downtime); maxSurge: 1 permits the brief two-pod
  # overlap during a roll — safe here for the same reason a scale-up is (see the
  # replicas note above): promotions are serialized by a Postgres session
  # advisory lock regardless of how many pods are running.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ring-promoter
  template:
    metadata:
      labels:
        app: ring-promoter
      annotations:
        # Roll the pod when the config changes: bump this or use
        # `kubectl rollout restart`.
        ring-promoter/config-revision: "1"
    spec:
      # jobshout uses the k8sjob deployer, so the control plane DOES call the
      # Kubernetes API (kubectl create/get/delete Job in ring-exec, read pod
      # logs). It runs as the ring-promoter ServiceAccount defined in
      # deploy/k8s/rbac.yaml, whose rights are namespaced to ring-exec only.
      # This SA is workstation-owned (created here), distinct from the
      # cluster-shared ring-promoter-deployer ClusterRole in diy-tax-return-uk.
      serviceAccountName: ring-promoter
      automountServiceAccountToken: true
      # Image is published linux/amd64 only (deploy-k3s1 buildx platforms).
      # Without this, a surge pod can land on an arm64 node and ImagePullBackOff
      # with "no match for platform in manifest", stalling rollout status.
      nodeSelector:
        kubernetes.kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        # The distroless :nonroot image's user is the NAME "nonroot"; Kubernetes
        # cannot verify a non-numeric user against runAsNonRoot, so pin the
        # distroless nonroot UID/GID (65532) numerically or the container fails
        # to start with CreateContainerConfigError.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ring-promoter
          image: docker.io/bwalia/ring-promoter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RP_CONFIG_FILE
              value: /etc/ringpromoter/config.yaml
            - name: RP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ring-promoter
                  key: RP_API_TOKEN
            - name: RP_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: ring-promoter
                  key: RP_DB_DSN
            # Token used by the per-app "github" deployer (e.g. wslproxy) to
            # dispatch its CI/CD workflow. Optional: only required if an app in
            # the ConfigMap uses `deployer: github`. Marked optional so clusters
            # with only Kubernetes apps need not provide it.
            - name: RP_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ring-promoter
                  key: RP_GITHUB_TOKEN
                  optional: true
            # Extra password gating deployments to the last ring (production).
            # Optional: without the Secret key, prod deploys need no password.
            - name: RP_PROD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ring-promoter
                  key: RP_PROD_PASSWORD
                  optional: true
            # Secret signing the JWT sent to the Ollama server (x-api-key) for
            # AI diagnosis of failed jobs. Optional: without it the feature is
            # simply disabled and the UI hides the button.
            - name: RP_OLLAMA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ring-promoter
                  key: RP_OLLAMA_JWT_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/ringpromoter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ring-promoter-config
