      # The PAT needs actions:write on bwalia/workstation-academy (private repo).
      # The ring-system and fictionally instances already carry such a token.
      # # academy (Workstation Academy) — the learner-facing Next.js site.
      # #
      # # GITHUB deployer, not k8sjob, for one hard reason: bwalia/workstation-academy
