# Application registry + runtime settings for the WORKSTATION instance,
# mounted at /etc/ringpromoter/config.yaml. Secrets (api_token, database.dsn)
# are injected via environment variables from the Secret and omitted here.
#
# Rings are the shared pipeline int -> test -> acc -> prod (defined in
# internal/ring/ring.go). ADD AN APPLICATION: append to `apps` and re-apply this
# ConfigMap. A ConfigMap change does not restart the pod on its own, so the
# deploy workflow issues a rollout restart after applying it; by hand it is
# `kubectl rollout restart deploy/ring-promoter -n workstation-ring-promoter`.
#
# THIS FILE IS THE SOURCE OF TRUTH and the deploy workflow applies it verbatim,
# so anything added to the live ConfigMap by hand and not mirrored here is
# silently deleted on the next push to main. jobshout-com and wslvault had
# drifted that way and were restored into this file on 2026-09-08.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ring-promoter-config
  namespace: workstation-ring-promoter
data:
  config.yaml: |
    listen_addr: ":8080"
    deployer: log         # global default; jobshout overrides to k8sjob below
    health: http          # real HTTP health checks against each ring's health_url
    database:
      driver: postgres    # DSN comes from RP_DB_DSN (Secret)
    retry:
      count: 3
      delay: 5s
    operation_timeout: 60m
    apps:
      # jobshout — deployed via the K8SJOB deployer: each seed/promote/rollback
      # runs as a short-lived Kubernetes Job in ring-exec (SA ring-deploy-job)
      # that helm-installs the jobshout chart into the ring's namespace. The
      # chart lives in the PUBLIC bwalia/jobshout repo, so the Job git-clones it
      # at the promoted SHA. RP injects RP_TARGET_ENV (int|test|acc|prod) and
      # RP_VERSION (the image tag). Requires the ring-exec RBAC in rbac.yaml and
      # the images pushed by jobshout's deploy-k3s.yml workflow.
      - name: jobshout
        display_name: "Jobshout AI Agents"
        location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
        deployer: k8sjob
        k8sjob:
          namespace: ring-exec
          image: docker.io/dtzar/helm-kubectl:3.15.4
          service_account: ring-deploy-job
          # SpectonCR registry creds (REGISTRY_USERNAME/REGISTRY_PASSWORD),
          # injected as env for the helm --set below. Create the secret once:
          #   kubectl -n ring-exec create secret generic jobshout-registry-creds \
          #     --from-literal=REGISTRY_USERNAME=<user> \
          #     --from-literal=REGISTRY_PASSWORD=<pass>
          env_from_secrets: [jobshout-registry-creds]
          # CNI overlay egress to github.com started failing ~2h after the last
          # good helm (TLS timeout / connection reset). The node itself can still
          # clone; hostNetwork uses that path.
          host_network: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ns="${RP_TARGET_ENV}"
              echo "deploy jobshout ${RP_VERSION} -> ns ${ns}"
              rm -rf /src
              n=0
              until git clone --depth 1 https://github.com/bwalia/jobshout /src; do
                n=$((n+1))
                if [ "$n" -ge 5 ]; then exit 1; fi
                echo "git clone failed (attempt $n), retrying..."
                sleep $((n*5))
              done
              # No --create-namespace: int/test/acc/prod are shared platform
              # namespaces that pre-exist (RBAC here is namespaced to them). The
              # ring-deploy-job SA has no cluster-scoped namespace rights.
              #
              # k3s1 has no External Secrets Operator, so use the chart's
              # plaintext fallback (externalSecret.enabled=false) and pass the
              # registry creds injected from jobshout-registry-creds so the
              # pull secret is valid.
              #
              # --timeout 12m, not 5m: every seed pushes three freshly-built
              # images (server/web/python-sidecar) that must be pulled COLD onto
              # whichever node the pods land on — the pod's node rarely has them
              # cached. That cold pull plus startup routinely runs past 5m, so
              # helm's --wait gave up and marked the release failed while the
              # pods went on to converge seconds later (int stayed up the whole
              # time because maxUnavailable:0 keeps the old pods serving). 12m
              # covers the cold-pull worst case and still finishes inside this
              # job's 20m timeout below, so a genuinely stuck deploy still fails.
              helm upgrade --install jobshout /src/deploy/helm/jobshout \
                --namespace "${ns}" \
                -f "/src/deploy/helm/jobshout/values-${ns}.yaml" \
                --set image.tag="${RP_VERSION}" \
                --set externalSecret.enabled=false \
                --set-string secrets.registryUsername="${REGISTRY_USERNAME}" \
                --set-string secrets.registryPassword="${REGISTRY_PASSWORD}" \
                --wait --timeout 12m
              echo "jobshout ${RP_VERSION} live in ${ns}"
          # Restart in place (POST /api/apps/jobshout/rings/{ring}/restart) —
          # e.g. after the Secrets Rotation agent rotates a Vault secret and ESO
          # re-syncs the k8s Secret, so pods re-read their env. Same Job as a
          # deploy (image, SA, env, host_network, timeout) but no helm/git: it
          # restarts the named Deployments, RP_RESTART_DEPLOYMENTS
          # (space-separated; empty = api + web), then waits for each rollout.
          # Names are listed explicitly, never selected by
          # app.kubernetes.io/instance=jobshout — that label also matches
          # redis, langfuse and minio in the ring namespaces. rp-deploy-jobshout
          # (rbac.yaml, bound in int/test/acc/prod) already allows patching
          # deployments, so no extra RBAC is needed.
          restart_args:
            - |
              set -eu
              ns="${RP_TARGET_ENV}"
              deps="${RP_RESTART_DEPLOYMENTS:-jobshout-api jobshout-web}"
              echo "restart jobshout ${RP_VERSION} in ns ${ns}: ${deps}"
              for d in $deps; do kubectl -n "$ns" rollout restart "deployment/$d"; done
              for d in $deps; do kubectl -n "$ns" rollout status "deployment/$d" --timeout=10m; done
              echo "jobshout restarted in ${ns}"
          resources: { cpu_request: 100m, memory_limit: 512Mi }
          # 20m, not 15m: helm --wait above is already 12m, so 15m left just 3m
          # for the git clone and helm's own startup. A cold pull that used most
          # of helm's budget got the whole Job killed before helm could report,
          # turning a slow-but-successful deploy into a reported failure (the
          # same class of false failure as bwalia/ring-promoter#102). The other
          # apps here already use 20m; this makes all five consistent.
          timeout: 20m
          retries: 0
          ttl_after_finished: 1h
        rings:
          int:  { target_env: int,  health_url: "http://jobshout-api.int.svc.cluster.local:8080/health", links: [ { label: "JobShout int", url: "https://int.jobshout.co.uk/" } ] }
          test: { target_env: test, health_url: "http://jobshout-api.test.svc.cluster.local:8080/health", links: [ { label: "JobShout test", url: "https://test.jobshout.co.uk/" } ] }
          acc:  { target_env: acc,  health_url: "http://jobshout-api.acc.svc.cluster.local:8080/health", links: [ { label: "JobShout acc", url: "https://acc.jobshout.co.uk/" } ] }
          prod: { target_env: prod, health_url: "http://jobshout-api.prod.svc.cluster.local:8080/health", links: [ { label: "JobShout", url: "https://jobshout.co.uk/" } ] }

      # jobshout-com — AI employment marketplace (Rust API + Next.js).
      # Separate Helm chart under jobshout-com/deploy/helm/jobshout-com.
      # Images: int-spectoncr…/jobshout-com/{api,web}:jsc-vX.Y.Z
      # UI: https://rp.workstation.co.uk/?app=jobshout-com
      # Public int: https://int.jobshout.com
      - name: jobshout-com
        display_name: "Jobshout Showcase and Insights"
        location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
        deployer: k8sjob
        k8sjob:
          namespace: ring-exec
          image: docker.io/dtzar/helm-kubectl:3.15.4
          service_account: ring-deploy-job
          env_from_secrets: [jobshout-registry-creds]
          host_network: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ns="${RP_TARGET_ENV}"
              echo "deploy jobshout-com ${RP_VERSION} -> ns ${ns}"
              rm -rf /src
              n=0
              until git clone --depth 1 --branch "${RP_VERSION}" https://github.com/bwalia/jobshout /src; do
                n=$((n+1))
                if [ "$n" -ge 5 ]; then
                  echo "tag clone failed; falling back to default branch"
                  git clone --depth 1 https://github.com/bwalia/jobshout /src || exit 1
                  break
                fi
                echo "git clone failed (attempt $n), retrying..."
                sleep $((n*5))
              done
              helm upgrade --install jobshout-com /src/jobshout-com/deploy/helm/jobshout-com \
                --namespace "${ns}" \
                -f "/src/jobshout-com/deploy/helm/jobshout-com/values-${ns}.yaml" \
                --set image.tag="${RP_VERSION}" \
                --set-string secrets.registryUsername="${REGISTRY_USERNAME}" \
                --set-string secrets.registryPassword="${REGISTRY_PASSWORD}" \
                --wait --timeout 15m
              echo "jobshout-com ${RP_VERSION} live in ${ns}"
          resources: { cpu_request: 100m, memory_limit: 512Mi }
          timeout: 20m
          retries: 0
          ttl_after_finished: 1h
        rings:
          int:  { target_env: int,  health_url: "http://jobshout-com-api.int.svc.cluster.local:8088/health", links: [ { label: "JobShout.com int", url: "https://int.jobshout.com/" } ] }
          test: { target_env: test, health_url: "http://jobshout-com-api.test.svc.cluster.local:8088/health", links: [ { label: "JobShout.com test", url: "https://test.jobshout.com/" } ] }
          acc:  { target_env: acc,  health_url: "http://jobshout-com-api.acc.svc.cluster.local:8088/health", links: [ { label: "JobShout.com acc", url: "https://acc.jobshout.com/" } ] }
          prod: { target_env: prod, health_url: "http://jobshout-com-api.prod.svc.cluster.local:8088/health", links: [ { label: "JobShout.com", url: "https://www.jobshout.com/" } ] }
      - name: wslvault
        display_name: "Workstation Vault Multi Region HA"
        location: { lat: 53.4808, lng: -2.2426, city: Manchester, region: GB }
        deployer: k8sjob
        k8sjob:
          namespace: ring-exec
          image: docker.io/dtzar/helm-kubectl:3.15.4
          service_account: ring-deploy-job
          # CNI overlay egress to github.com is flaky on some nodes; hostNetwork
          # uses the node's path (same as jobshout).
          host_network: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              env="${RP_TARGET_ENV}"
              ver="${RP_VERSION}"
              case "${env}" in
                region-a)
                  ns="wslvault"
                  values="deploy/gitops/regions/region-a.values.yaml"
                  ;;
                region-b)
                  ns="wslvault-b"
                  values="deploy/gitops/regions/region-b.values.yaml"
                  ;;
                *)
                  echo "unknown RP_TARGET_ENV=${env} (expected region-a|region-b)"
                  exit 1
                  ;;
              esac
              echo "deploy wslvault ${ver} -> ns ${ns} (${env}, ring ${RP_RING})"
              rm -rf /src
              n=0
              until git clone --depth 1 --branch "${ver}" https://github.com/bwalia/wslvault /src; do
                n=$((n+1))
                if [ "$n" -ge 5 ]; then exit 1; fi
                echo "git clone failed (attempt $n), retrying..."
                sleep $((n*5))
              done
              cd /src
              # Region values pin explicit per-service tags; --set overrides all of
              # them plus global.imageTag so lease-manager / sync-scheduler (which
              # fall back to global) cannot lag behind.
              # No --create-namespace: wslvault / wslvault-b already exist; the
              # ring-deploy-job SA has no cluster-scoped namespace rights.
              helm upgrade --install wslvault ./deploy/helm/wslvault \
                --namespace "${ns}" \
                -f "${values}" \
                --set global.imageTag="${ver}" \
                --set ui.image.tag="${ver}" \
                --set identityService.image.tag="${ver}" \
                --set regionHealth.image.tag="${ver}" \
                --set secretEngine.image.tag="${ver}" \
                --set policyEngine.image.tag="${ver}" \
                --set transitEngine.image.tag="${ver}" \
                --set auditService.image.tag="${ver}" \
                --set pkiEngine.image.tag="${ver}" \
                --set mcpServer.image.tag="${ver}" \
                --set cryptoService.image.tag="${ver}" \
                --set replicationAgent.image.tag="${ver}" \
                --wait --timeout 15m
              echo "wslvault ${ver} live in ${ns}"
          resources: { cpu_request: 100m, memory_limit: 512Mi }
          timeout: 20m
          retries: 0
          ttl_after_finished: 1h
        rings:
          # Wave 0 — Manchester. Auto-promote onward so a seed rolls London too.
          int:
            target_env: region-a
            display_name: "region-a · Manchester"
            health_url: "https://vault-ui.workstation.co.uk/api/version"
            health_version_field: version
            auto_promote: true
            links: [ { label: "WSLVault (Manchester)", url: "https://vault-ui.workstation.co.uk/" } ]
          # Wave 1 — London. Stop here; higher rings are unused for this app.
          test:
            target_env: region-b
            display_name: "region-b · London"
            health_url: "https://vault-ha.workstation.co.uk/api/version"
            health_version_field: version
            auto_promote: false
            links: [ { label: "WSLVault (London)", url: "https://vault-ha.workstation.co.uk/" } ]

      # ── beacon + sysops — the monitoring platform, one stack per brand ──
      #
      # One repo (PUBLIC bwalia/beaconpulse), one pipeline, two registered apps,
      # the same shape as fishers/gullycricket below. A brand is its own release
      # in its own namespace (beacon: int/test/acc/prod; sysops: sysops-<ring>)
      # with its own host, and its own frontend image, because the brand is baked
      # into the Next.js bundle at build time (frontend:<brand>-<sha>).
      #
      # GITHUB deployer, not k8sjob: helm is not the whole deploy. Each ring also
      # needs its Cloudflare record and wslproxy vhost upserted, the brand's
      # frontend built, and its pull/app secrets copied into <brand>-<ring>;
      # deploy-k3s.yml does all of that in order. A bare helm Job also cannot
      # work here: every ring pulls from its own registry (<ring>-spectoncr,
      # prod from int-spectoncr), so a promote has to build into the target
      # registry when it lacks the image.
      #
      # The promoted VERSION is a git ref, and the one to promote is a v* tag:
      # auto-tag.yml cuts one on every merge to main. deploy-k3s.yml resolves it
      # to a commit up front, builds that commit only if the target registry has
      # no image for it yet, and deploys its short sha as the image tag, so prod
      # runs the exact image int ran (same registry, nothing rebuilt).
      #
      # Merges to main still deploy beacon int directly (deploy-k3s.yml on push),
      # outside this promoter.
      #
      # Both apps dispatch the SAME workflow, and the run lookup takes the newest
      # dispatch, so do not start a beacon and a sysops deploy in the same minute.
      - name: beacon
        display_name: "Beacon Pulse Monitoring"
        location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
        deployer: github
        github:
          owner: bwalia
          repo: beaconpulse
          workflow: deploy-k3s.yml
          ref: main
          env_input: TARGET_ENV
          version_input: IMAGE_TAG
          mode_input: DEPLOYMENT_TYPE
          deploy_mode: build-and-deploy
          extra_inputs: { BRAND: beacon }
          token_env: RP_GITHUB_TOKEN
          poll_interval: 20s
          run_lookup_timeout: 90s
        rings:
          int:  { target_env: int,  health_url: "http://beacon-api.int.svc.cluster.local:8080/readyz", links: [ { label: "BeaconPulse int", url: "https://int.beaconpulse.net/" } ] }
          test: { target_env: test, health_url: "http://beacon-api.test.svc.cluster.local:8080/readyz", links: [ { label: "BeaconPulse test", url: "https://test.beaconpulse.net/" } ] }
          acc:  { target_env: acc,  health_url: "http://beacon-api.acc.svc.cluster.local:8080/readyz", links: [ { label: "BeaconPulse acc", url: "https://acc.beaconpulse.net/" } ] }
          prod: { target_env: prod, health_url: "http://beacon-api.prod.svc.cluster.local:8080/readyz", links: [ { label: "BeaconPulse", url: "https://beaconpulse.net/" } ] }

      # SysOps 24/7 (sysops247.com). PUBLIC health URLs, not in-cluster Service
      # DNS: sysops-prod is pinned to cloud003, an edge node the CNI overlay does
      # not reach from here (the workstation-opsapi problem below), and
      # sysops-test is pinned to debian001. /api/v1/system/info answers through
      # the edge on every ring. int.sysops247.com runs a July build that predates
      # that endpoint, so it reads unhealthy until its first deploy from here.
      - name: sysops
        display_name: "SysOps 24/7"
        location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
        deployer: github
        github:
          owner: bwalia
          repo: beaconpulse
          workflow: deploy-k3s.yml
          ref: main
          env_input: TARGET_ENV
          version_input: IMAGE_TAG
          mode_input: DEPLOYMENT_TYPE
          deploy_mode: build-and-deploy
          extra_inputs: { BRAND: sysops }
          token_env: RP_GITHUB_TOKEN
          poll_interval: 20s
          run_lookup_timeout: 90s
        rings:
          int:  { target_env: int,  health_url: "https://int.sysops247.com/api/v1/system/info",  links: [ { label: "SysOps int", url: "https://int.sysops247.com/" } ] }
          test: { target_env: test, health_url: "https://test.sysops247.com/api/v1/system/info", links: [ { label: "SysOps test", url: "https://test.sysops247.com/" } ] }
          acc:  { target_env: acc,  health_url: "https://acc.sysops247.com/api/v1/system/info",  links: [ { label: "SysOps acc", url: "https://acc.sysops247.com/" } ] }
          prod: { target_env: prod, health_url: "https://sysops247.com/api/v1/system/info",      links: [ { label: "SysOps 24/7", url: "https://sysops247.com/" } ] }

      # ── workstation-opsapi + workstation-opsapi-ui — OpsAPI on *.workstation.co.uk ──
      #
      # PUBLIC repo bwalia/opsapi. Two apps, one product: the API (Lua/Lapis,
      # *-opsapi.workstation.co.uk) and its dashboard (Next.js,
      # *-opsapi-ui.workstation.co.uk), each deployed by the repo's own
      # workflow, the same way sysops and gullycricket are.
      #
      # GITHUB deployer, not k8sjob (which this used to be). helm is not the
      # whole deploy: deploy-k3s.yml also keeps the Cloudflare record and the
      # wslproxy vhost in place, runs the database migrations (pre-upgrade
      # hook) with this release's code, waits for ESO to render config.lua and
      # rolls the pods so they pick it up. The old Job ran bare helm with
      # image.tag=<git tag>, a tag the registry never had (builds were tagged
      # <version>-<run>), so a promote from here could not have succeeded.
      #
      # The promoted VERSION is a release tag (1.0.x): a merge to main cuts one
      # (via the opsapi-autotag app on the diytaxreturn instance) and pushes the
      # image as bwalia/opsapi:<version> as well as <version>-<run>. Ring
      # Promoter sends it as IMAGE_TAG with DEPLOYMENT_TYPE=deploy, so prod runs
      # the exact image int ran — nothing is rebuilt. Releases cut after
      # bwalia/opsapi#693 carry the bare tag and /ready reports `version`, which
      # is checked after every deploy, so an old pod still answering 200 doesn't
      # pass. Promote one of those, not an older release.
      #
      # Merges to main deploy int directly (deploy-k3s.yml on push), outside
      # this promoter. Only int and prod exist (values-workstation-<ring>.yaml),
      # and rings never skip, so there is no int -> prod promote button: SEED
      # prod with the release int runs (prod seed needs the prod password), the
      # same as workstation-shop. Add test/acc here once those environments
      # exist (Vault path, database, host).
      #
      # Health is the public URL: the prod pod runs on cloud003, an edge node
      # the in-cluster overlay does not reach (http://workstation-opsapi.prod
      # .svc.cluster.local:80/ready times out while the pod is Running). The
      # wslproxy edge reaches every ring wherever its pods land.
      #
      # Needs RP_GITHUB_TOKEN to be allowed to dispatch workflows in bwalia/opsapi.
      - name: workstation-opsapi
        display_name: "Workstation OpsAPI"
        location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
        deployer: github
        github:
          owner: bwalia
          repo: opsapi
          workflow: deploy-k3s.yml
          ref: main
          env_input: TARGET_ENV
          version_input: IMAGE_TAG
          mode_input: DEPLOYMENT_TYPE
          deploy_mode: deploy
          token_env: RP_GITHUB_TOKEN
          poll_interval: 20s
          run_lookup_timeout: 90s
        rings:
          int:  { target_env: int,  health_url: "https://int-opsapi.workstation.co.uk/ready", health_version_field: version, links: [ { label: "OpsAPI UI", url: "https://int-opsapi-ui.workstation.co.uk/" }, { label: "OpsAPI", url: "https://int-opsapi.workstation.co.uk/", kind: api }, { label: "OpsAPI docs", url: "https://int-opsapi.workstation.co.uk/swagger", kind: docs } ] }
          prod: { target_env: prod, health_url: "https://opsapi.workstation.co.uk/ready", health_version_field: version, links: [ { label: "OpsAPI UI", url: "https://opsapi-ui.workstation.co.uk/" }, { label: "OpsAPI", url: "https://opsapi.workstation.co.uk/", kind: api }, { label: "OpsAPI docs", url: "https://opsapi.workstation.co.uk/swagger", kind: docs } ] }

      # The dashboard is built per ring (its API URL is baked into the Next.js
      # bundle), so a promote BUILDS the release tag for the target ring:
      # deploy-workstation-dashboard.yml checks out VERSION and deploys it. The
      # workflow has no mode input. Promote the API first, then this, with the
      # same release. Health is the public login page (no version endpoint).
      - name: workstation-opsapi-ui
        display_name: "Workstation OpsAPI UI"
        location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
        deployer: github
        github:
          owner: bwalia
          repo: opsapi
          workflow: deploy-workstation-dashboard.yml
          ref: main
          env_input: TARGET_ENV
          version_input: VERSION
          mode_input: "-"
          token_env: RP_GITHUB_TOKEN
          poll_interval: 20s
          run_lookup_timeout: 90s
        rings:
          int:  { target_env: int,  health_url: "https://int-opsapi-ui.workstation.co.uk/login", links: [ { label: "OpsAPI UI int", url: "https://int-opsapi-ui.workstation.co.uk/" } ] }
          prod: { target_env: prod, health_url: "https://opsapi-ui.workstation.co.uk/login", links: [ { label: "OpsAPI UI", url: "https://opsapi-ui.workstation.co.uk/" } ] }

      # ── workstation-shop — shop.workstation.co.uk (Workstation AI Shop) ──
      #
      # GITHUB deployer: the shop's own pipeline (bwalia/workstation-website,
      # .github/workflows/shop-deploy.yaml) does more than helm — it merges
      # repo secrets into wslvault, nudges ESO, runs helm with --wait=legacy
      # and smoke-tests /api/health. Dispatched with TARGET_ENV=<ring> and
      # IMAGE_TAG=<version>; the version is the image tag, which is the git
      # SHA (7) that shop-deploy built and pushed on merge to main, so int
      # and prod run the exact same artefact. The workflow has no mode input,
      # hence mode_input: "-".
      #
      # Only int and prod exist for the shop (values-int / values-prod).
      # Rings never skip, so there is no int -> prod promote button: each
      # ring is SEEDED with a version (prod seed needs the prod password).
      # Health is the public URL (the prod pod runs on the cloud003 edge node,
      # same overlay constraint as workstation-opsapi) and is version-verified:
      # /api/health reports the image tag it is running.
      - name: workstation-shop
        display_name: "Workstation AI Shop"
        location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
        deployer: github
        github:
          owner: bwalia
          repo: workstation-website
          workflow: shop-deploy.yaml
          ref: main
          env_input: TARGET_ENV
          version_input: IMAGE_TAG
          mode_input: "-"
          token_env: RP_GITHUB_TOKEN
          poll_interval: 20s
          run_lookup_timeout: 90s
        rings:
          int:  { target_env: int,  health_url: "https://int-shop.workstation.co.uk/api/health", health_version_field: version, links: [ { label: "Shop int", url: "https://int-shop.workstation.co.uk/" }, { label: "Shop admin", url: "https://int-opsapi-ui.workstation.co.uk/dashboard/shop" } ] }
          prod: { target_env: prod, health_url: "https://shop.workstation.co.uk/api/health", health_version_field: version, links: [ { label: "Shop", url: "https://shop.workstation.co.uk/" }, { label: "Shop admin", url: "https://opsapi-ui.workstation.co.uk/dashboard/shop" } ] }

      # ── fishers + gullycricket — the club-sports app, one stack per brand ──
      #
      # One repo (PUBLIC bwalia/fishers), one pipeline, two registered apps. A
      # brand here is a whole stack, not a skin: its own namespace
      # (<brand>-<ring>), its own Zalando Postgres, its own MinIO bucket, its
      # own vault path (kv/<brand>/<ring>/config — a token minted by one brand
      # must not authenticate on the other) and its own dashboard image,
      # because the brand is baked into the Next.js bundle at build time. The
      # only thing the two share is the API binary, pointed at a different
      # database.
      #
      # GITHUB deployer, not k8sjob, even though the repo is public and could
      # be cloned by a Job: helm is not the whole deploy. Each ring also needs
      # its vault secrets synced and ESO force-refreshed, its Postgres cluster
      # reconciled, MinIO's root credentials kept identical to the API's S3
      # keys, its Cloudflare record and wslproxy vhost upserted, and a smoke
      # test from inside the namespace. deploy-single-environment.yml does all
      # of that in order and stops at the first thing missing; a Job running
      # bare helm would go green and serve 503s.
      #
      # The promoted VERSION is a git ref, and the one to promote is a v* tag —
      # the repo's Auto Tag workflow cuts one on every merge to main. The
      # workflow resolves the ref to a commit once, up front, and that sha is
      # the image tag in every ring, so acc and prod run the exact artefact int
      # and test ran rather than a rebuild of the same source. int and test
      # build from the ref; acc and prod refuse a commit the registry has no
      # images for and say which.
      #
      # ENV / DEPLOY_BRANCH / DEPLOY_MODE are this deployer's own defaults and
      # the workflow declares exactly those, so only `brand` needs saying.
      # `ref: main` is NOT optional: the default is "build", a branch this repo
      # does not have, and the dispatch would 404.
      #
      # Health is the API's own /health in the ring's namespace, cross-namespace
      # over the cluster overlay — the same path jobshout and beacon take. No
      # fishers pod is scheduled on an edge node, which is what forced
      # workstation-opsapi onto public URLs instead.
      - name: fishers
        display_name: "Fishers"
        location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
        deployer: github
        github:
          owner: bwalia
          repo: fishers
          workflow: deploy-single-environment.yml
          ref: main
          deploy_mode: full
          extra_inputs: { brand: fishers }
          token_env: RP_GITHUB_TOKEN
          poll_interval: 20s
          run_lookup_timeout: 90s
        rings:
          # PUBLIC, unlike the three rings below it, and not a preference:
          # fishers int is the one ring with a Kong gateway in front of the API
          # (brands/fishers.yaml lists `gateway: [int]`), and that deploy also
          # installs a NetworkPolicy, fishers-api-allow-kong-only, admitting
          # port 8080 from the `kong` and `kube-system` namespaces and nothing
          # else. A health check from this namespace is therefore REFUSED —
          # which is what "dial tcp 10.43.3.22:8080: connect: connection
          # refused" was, four times over, on a ring that was serving the whole
          # time. Going in through the gateway's own Service does not help
          # either: it answers from the kong namespace and times out from here.
          #
          # So this ring is checked the way its users reach it. That tests more
          # than the pod — DNS, the edge, the certificate and Kong are all on
          # the path — which for the one ring that has a gateway is the right
          # thing to be asserting anyway.
          #
          # Any ring added to `gateway:` in brands/fishers.yaml needs the same
          # change, or its health check starts failing the same way.
          int:  { target_env: int,  health_url: "https://int.fishers.cloud/health",  links: [ { label: "Fishers int", url: "https://int.fishers.cloud/" }, { label: "API docs", url: "https://int.fishers.cloud/swagger-ui", kind: docs } ] }
          test: { target_env: test, health_url: "http://fishers-api.fishers-test.svc.cluster.local:8080/health", links: [ { label: "Fishers test", url: "https://test.fishers.cloud/" } ] }
          acc:  { target_env: acc,  health_url: "http://fishers-api.fishers-acc.svc.cluster.local:8080/health",  links: [ { label: "Fishers acc", url: "https://acc.fishers.cloud/" } ] }
          prod: { target_env: prod, health_url: "http://fishers-api.fishers-prod.svc.cluster.local:8080/health", links: [ { label: "Fishers", url: "https://www.fishers.cloud/" } ] }

      # GullyCricket — same repo, same pipeline, its own stack. Only int exists
      # today, because the merge-to-main CD deploys every brand's int and
      # nothing above it, and no other path knew about brands at all until
      # bwalia/fishers taught deploy-single-environment.yml the `brand` input.
      #
      # A first promote into test/acc/prod creates that ring's namespace and
      # everything in it, but NOT its vault path: the deploy stops there and
      # names it. Seed it first, from the repo —
      #   scripts/vault-seed-ring.sh <ring> --brand gullycricket
      # which generates that ring its own JWT_SECRET, S3 keys and VAPID pair.
      # The brand's integration keys go in by hand afterwards (Stripe, and a
      # Google OAuth client whose authorised origins name the GullyCricket
      # host); copying Fishers' would land two brands' takings in one account.
      - name: gullycricket
        display_name: "GullyCricket"
        location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
        deployer: github
        github:
          owner: bwalia
          repo: fishers
          workflow: deploy-single-environment.yml
          ref: main
          deploy_mode: full
          extra_inputs: { brand: gullycricket }
          token_env: RP_GITHUB_TOKEN
          poll_interval: 20s
          run_lookup_timeout: 90s
        rings:
          int:  { target_env: int,  health_url: "http://fishers-api.gullycricket-int.svc.cluster.local:8080/health",  links: [ { label: "GullyCricket int", url: "https://int.gullycricket.app/" }, { label: "API docs", url: "https://int.gullycricket.app/swagger-ui", kind: docs } ] }
          test: { target_env: test, health_url: "http://fishers-api.gullycricket-test.svc.cluster.local:8080/health", links: [ { label: "GullyCricket test", url: "https://test.gullycricket.app/" } ] }
          acc:  { target_env: acc,  health_url: "http://fishers-api.gullycricket-acc.svc.cluster.local:8080/health",  links: [ { label: "GullyCricket acc", url: "https://acc.gullycricket.app/" } ] }
          prod: { target_env: prod, health_url: "http://fishers-api.gullycricket-prod.svc.cluster.local:8080/health", links: [ { label: "GullyCricket", url: "https://www.gullycricket.app/" } ] }

      # wslproxy-k3s1 moved to its own instance, https://rp.wslproxy.com,
      # owned by bwalia/wslproxy deploy/ring-promoter/ (2026-09-24).

      # ── academy (Workstation Academy) — REGISTERED BUT DISABLED ──────────────
      # Uncomment the block below to enable. It is commented out for one reason
      # only: the github deployer is a HARD boot requirement, not a soft one —
      # with the app registered and no token the process exits at startup with
      #   fatal: app "academy" uses the github deployer but env RP_GITHUB_TOKEN is empty
      # and the whole control plane (jobshout, beacon, opsapi…) goes down with it.
      # Verified on 2026-09-08: enabling it crash-looped the new pod; only
      # maxUnavailable:0 kept the old one serving.
      #
      # RP_GITHUB_TOKEN IS on secret/ring-promoter here now — the fishers and
      # gullycricket apps above are dispatched with it — so the reason below is
      # no longer the blocker it was. What is still unchecked is whether that
      # token carries actions:write on the PRIVATE bwalia/workstation-academy;
      # if it does not, every academy promote fails on an unauthenticated
      # dispatch, which is the failure the note below describes.
      #
      # TO ENABLE — add the key, then uncomment:
