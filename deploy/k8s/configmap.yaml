      # repo secrets into wslvault, nudges ESO, runs helm with --wait=legacy
      # and smoke-tests /api/health. Dispatched with TARGET_ENV=<ring> and
      # IMAGE_TAG=<version>; the version is the image tag, which is the git
      # SHA (7) that shop-deploy built and pushed on merge to main, so int
      # and prod run the exact same artefact. The workflow has no mode input,
      # hence mode_input: "-".
      #
      # All four rings exist (values-int/test/acc/prod). A merge to main builds
      # the image and SEEDS int (shop-deploy's seed-ring-promoter job); promote
      # int -> test -> acc -> prod from here (prod needs the prod password).
      # Health is the public URL (the prod pod runs on the cloud003 edge node,
      # same overlay constraint as workstation-opsapi) and is version-verified:
      # /api/health reports the image tag it is running.
      - name: workstation-shop
        display_name: "Workstation AI Shop"
        location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
        deployer: github
        github:
          owner: bwalia
          repo: workstation-website
          workflow: shop-deploy.yaml
          ref: main
          env_input: TARGET_ENV
          version_input: IMAGE_TAG
          mode_input: "-"
          token_env: RP_GITHUB_TOKEN
          poll_interval: 20s
          run_lookup_timeout: 90s
        # K8SJOB deployer, ring by ring (rings.<ring>.deployer overrides the app's
        # github deployer). The Job (bwalia/rp-deployer, ring-promoter
        # deploy/deployer/) clones shop-chart from the PRIVATE workstation-website at
        # the promoted commit with a read-only deploy key (ESO Secret
        # rp-deploy-workstation-website-key, from wslvault), helm-upgrades
        # shop-<ring> with --wait=legacy, waits for the rollout and checks
        # /api/health reports the tag: what shop-deploy.yaml's deploy job did,
        # without a GitHub runner. Secrets are already in wslvault
        # (workstation-shop/<env>/config via ESO), so no repo secrets are needed.
        # Runs as ServiceAccount rp-deploy-workstation-shop (rbac.yaml), bound in
        # int/test/acc only. Roll a ring back to GitHub by deleting its
        # `deployer: k8sjob`.
        k8sjob:
          namespace: ring-exec
          image: docker.io/bwalia/rp-deployer:0.1.0
          service_account: rp-deploy-workstation-shop
          env_from_secrets: [rp-deploy-workstation-website-key]
          env:
            GIT_REPO: "git@github.com:bwalia/workstation-website.git"
            CHART_PATH: devops/helm-charts/shop-chart
            RELEASE_PREFIX: "shop-"
            DEPLOYMENT_SUFFIX: "-shop-chart"
            IMAGE_REPOSITORY: bwalia/wsw-shop
            SMOKE_URL: "https://{env}-shop.workstation.co.uk/api/health"
            SMOKE_URL_PROD: "https://shop.workstation.co.uk/api/health"
          # LAN workers only: edge nodes' pod traffic can't reach the rest.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - { key: node-role.kubernetes.io/edge, operator: DoesNotExist }
          resources: { cpu_request: 100m, memory_request: 128Mi, memory_limit: 512Mi }
          # helm --timeout 15m + rollout + smoke fit inside 25m.
          timeout: 25m
          retries: 0
          ttl_after_finished: 1h
        rings:
          int:  { deployer: k8sjob, target_env: int,  health_url: "https://int-shop.workstation.co.uk/api/health", health_version_field: version, links: [ { label: "Shop int", url: "https://int-shop.workstation.co.uk/" }, { label: "Shop admin", url: "https://int-opsapi-ui.workstation.co.uk/dashboard/shop" } ] }
          test: { deployer: k8sjob, target_env: test, health_url: "https://test-shop.workstation.co.uk/api/health", health_version_field: version, links: [ { label: "Shop test", url: "https://test-shop.workstation.co.uk/" }, { label: "Shop admin", url: "https://test-opsapi-ui.workstation.co.uk/dashboard/shop" } ] }
          acc:  { deployer: k8sjob, target_env: acc,  health_url: "https://acc-shop.workstation.co.uk/api/health", health_version_field: version, links: [ { label: "Shop acc", url: "https://acc-shop.workstation.co.uk/" }, { label: "Shop admin", url: "https://acc-opsapi-ui.workstation.co.uk/dashboard/shop" } ] }
          prod: { target_env: prod, health_url: "https://shop.workstation.co.uk/api/health", health_version_field: version, links: [ { label: "Shop", url: "https://shop.workstation.co.uk/" }, { label: "Shop admin", url: "https://opsapi-ui.workstation.co.uk/dashboard/shop" } ] }

