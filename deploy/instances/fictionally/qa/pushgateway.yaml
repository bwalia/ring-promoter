# QA metrics for the training instance's Grafana gates.
#
# CI (.github/workflows/hello-world-qa.yml) pushes each unit-test run here; the
# obs Prometheus in `prod` scrapes it through the ServiceMonitor below (its
# serviceMonitorSelector is {} across all namespaces), and grafana.workstation.co.uk
# reads that Prometheus. Ring Promoter's Grafana gate then queries the same
# series, so the dashboard a human looks at and the verdict the gate enforces
# come from one place.
#
# ClusterIP only, on purpose: a Pushgateway accepts unauthenticated writes, so
# it is never exposed. CI reaches it with `kubectl port-forward`.
#
# Applied by deploy-training-k3s1.yml on every training deploy.
apiVersion: v1
kind: Namespace
metadata:
  name: rp-qa
  labels:
    app.kubernetes.io/part-of: ring-promoter-training
---
# Persist pushed groups across restarts: without this a pod reschedule empties
# the gate until the next nightly run (it would read "no data", never GO).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rp-qa-pushgateway
  namespace: rp-qa
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rp-qa-pushgateway
  namespace: rp-qa
  labels: { app.kubernetes.io/name: rp-qa-pushgateway }
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO volume: never two pods at once
  selector:
    matchLabels: { app.kubernetes.io/name: rp-qa-pushgateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rp-qa-pushgateway }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pushgateway
          image: docker.io/prom/pushgateway:v1.11.1
          args:
            - --persistence.file=/data/metrics.store
            - --persistence.interval=1m
          ports:
            - { name: http, containerPort: 9091 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rp-qa-pushgateway }
---
apiVersion: v1
kind: Service
metadata:
  name: rp-qa-pushgateway
  namespace: rp-qa
  labels: { app.kubernetes.io/name: rp-qa-pushgateway }
spec:
  selector: { app.kubernetes.io/name: rp-qa-pushgateway }
  ports:
    - { name: http, port: 9091, targetPort: http }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rp-qa-pushgateway
  namespace: rp-qa
  labels: { app.kubernetes.io/name: rp-qa-pushgateway }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: rp-qa-pushgateway }
  endpoints:
    - port: http
      interval: 30s
      # Keep the pushed job/app labels instead of relabelling them to the
      # Pushgateway's own — the gate queries by app="<name>".
      honorLabels: true
