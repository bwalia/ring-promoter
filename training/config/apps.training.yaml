# Ring Promoter — training academy instance configuration.
#
# This is the FULL config for the training instance served at
# https://ring-promoter.fictionally.org. It registers all seven sample apps so
# that, between them, EVERY Ring Promoter capability can be demonstrated live.
#
# Secrets come from the environment (never this file):
#   RP_API_TOKEN         bearer token for /api
#   RP_PROD_PASSWORD     extra password for production deploys
#   RP_GITHUB_TOKEN      token for the github deployer (operator)
#   RP_JIRA_TOKEN        token for the change-request (jira) gate (bank-api)
#   RP_OLLAMA_JWT_SECRET enables AI failure diagnosis
#
# Health checks target in-cluster Service DNS. Each app is deployed per ring
# into namespace <app>-<ring> with Helm release name <app> and
# fullnameOverride=<app>, so its Service is <app>.<app>-<ring>.svc.cluster.local
# (see training/config/README.md and the deployment runbook).

listen_addr: ":8080"
# api_token: provided via RP_API_TOKEN (Secret) — do not put it here.

deployer: kubectl        # global default; per-app overrides below
health: http             # real HTTP health checks (version-aware where set)

retry:
  count: 5
  delay: 10s
operation_timeout: 15m

database:
  driver: postgres       # DSN from RP_DB_DSN
  # dsn: provided via RP_DB_DSN

# AI failure diagnosis: when a deploy fails, the UI can ask Ollama to explain
# why. Enabled once RP_OLLAMA_JWT_SECRET is also set. (Demonstrated by ai-chat.)
ollama:
  url: "https://ollama.workstation.co.uk"
  model: "qwen3-coder:30b"

apps:
  # 1) hello-world — kubectl deployer, version-aware health via a JSON field.
  #    Feature focus: seed/promote/rollback, auto_promote, health_version_field,
  #    and the full QA + security + compliance gate stack:
  #
  #      ring  | Grafana: QA + security posture | AppSec (per version) | sign-off
  #      int   |               ✓                |                      |
  #      test  |               ✓                |          ✓           |
  #      acc   |               ✓                |          ✓           |
  #      prod  |               ✓                |          ✓           |    ✓
  #
  #    The evidence comes from .github/workflows/hello-world-qa.yml, which runs
  #    on every hello-world change and nightly, all open source: go test, gosec
  #    + Semgrep (SAST), govulncheck (SCA), gitleaks (secrets), Checkov (CIS
  #    Docker/Kubernetes), Syft (SBOM), Grype (image CVEs), a licence policy,
  #    and buildx SLSA provenance. Each result is (a) pushed as metrics to the
  #    rp-qa Pushgateway (deploy/instances/fictionally/qa) and read back through
  #    grafana.workstation.co.uk — the Grafana gate below — and (b) uploaded as
  #    SARIF to POST /api/security/scans for the exact version, which the
  #    non-overridable security gate judges.
  #
  #    The two differ on purpose: Grafana shows the posture of the LATEST build
  #    (a CVE published overnight turns it NO-GO for every promotion, and a
  #    release engineer may overrule it with a recorded reason); the security
  #    gate judges the EXACT version being promoted and can only be satisfied
  #    by clean scans or per-finding waivers.
  - name: hello-world
    display_name: "Hello World"
    location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
    links:
      - { label: "Sample app guide", url: "https://github.com/bwalia/ring-promoter/tree/main/training/sample-apps/hello-world", kind: docs }
      - { label: "QA unit tests", url: "https://grafana.workstation.co.uk/d/rp-qa-unit-tests?var-app=hello-world", kind: dashboard }
      - { label: "Security & compliance", url: "https://grafana.workstation.co.uk/d/rp-security-compliance?var-app=hello-world", kind: dashboard }
    promotion_policy:
      # QA + security posture gate: the verdicts CI pushed, read from the obs Prometheus
      # behind grafana.workstation.co.uk (token: RP_GRAFANA_TOKEN, a Viewer
      # service account "ring-promoter-training" on that Grafana). One red
      # check blocks the promotion; a release engineer can overrule it from the
      # ring's panel, with a recorded reason, when a red is a known flake.
      grafana:
        rings: [int, test, acc, prod]
        url: https://grafana.workstation.co.uk
        dashboard_uid: rp-qa-unit-tests
        dashboard_name: "Ring Promoter — QA Unit Tests"
        datasource_uid: prometheus
        # Required for Prometheus: without it the query is sent as SQL.
        datasource_type: prometheus
        go_min: 2          # 2 = the latest run passed
        no_go_max: 0       # 0 = a test failed or the suite did not build
        # Range query with maxDataPoints=1: keep the window short so a fixed
        # suite reads GO within minutes of the re-run.
        lookback: 5m
        max_age: 36h
        # Staleness lives INSIDE each query: the Pushgateway is re-scraped every
        # 30s, so the sample always looks fresh. Joining on the run timestamp
        # makes a suite that stopped running (36h = 129600s, the nightly run plus
        # slack) read "no data" instead of holding its last GO forever.
        checks:
          - name: "Unit tests"
            query: |
              rp_qa_unit_last_run_status{app="hello-world"}
                and on(app)
              (time() - rp_qa_unit_last_run_timestamp_seconds{app="hello-world"} < 129600)
          - name: "Pass rate"
            unit: "%"
            go_min: 100
            no_go_max: 95
            query: |
              rp_qa_unit_pass_rate_percent{app="hello-world"}
                and on(app)
              (time() - rp_qa_unit_last_run_timestamp_seconds{app="hello-world"} < 129600)
          - name: "Coverage"
            unit: "%"
            go_min: 70
            no_go_max: 50
            query: |
              rp_qa_unit_coverage_percent{app="hello-world"}
                and on(app)
              (time() - rp_qa_unit_last_run_timestamp_seconds{app="hello-world"} < 129600)
          # Security posture ("Ring Promoter — Security & Compliance"): 2 = no
          # critical/high finding of that kind in the latest scan, 0 = blocked.
          - name: "SAST (gosec + Semgrep)"
            query: |
              min(rp_sec_scan_status{app="hello-world",kind="sast"}
                and on(app,kind) (time() - rp_sec_scan_timestamp_seconds{app="hello-world",kind="sast"} < 129600))
          - name: "SCA (govulncheck)"
            query: |
              min(rp_sec_scan_status{app="hello-world",kind="sca"}
                and on(app,kind) (time() - rp_sec_scan_timestamp_seconds{app="hello-world",kind="sca"} < 129600))
          - name: "Secrets (gitleaks)"
            query: |
              min(rp_sec_scan_status{app="hello-world",kind="secrets"}
                and on(app,kind) (time() - rp_sec_scan_timestamp_seconds{app="hello-world",kind="secrets"} < 129600))
          - name: "Image CVEs (Grype)"
            query: |
              min(rp_sec_scan_status{app="hello-world",kind="container"}
                and on(app,kind) (time() - rp_sec_scan_timestamp_seconds{app="hello-world",kind="container"} < 129600))
          - name: "Licences"
            query: |
              min(rp_sec_scan_status{app="hello-world",kind="license"}
                and on(app,kind) (time() - rp_sec_scan_timestamp_seconds{app="hello-world",kind="license"} < 129600))
          # Compliance: Checkov CIS Docker + Kubernetes benchmark pass rate.
          # Documented exceptions (.checkov.yaml) don't count against it.
          - name: "CIS compliance (Checkov)"
            unit: "%"
            go_min: 95
            no_go_max: 80
            query: |
              min(rp_sec_compliance_score_percent{app="hello-world"}
                and on(app) (time() - rp_sec_scan_timestamp_seconds{app="hello-world",kind="iac"} < 129600))
          # Supply chain: an SBOM for the latest image, and SLSA provenance
          # attached to it (1 = in place, 0 = missing).
          - name: "SBOM (Syft)"
            go_min: 1
            no_go_max: 0
            query: |
              min(rp_sec_sbom_present{app="hello-world"}
                and on(app) (time() - rp_sec_scan_timestamp_seconds{app="hello-world",kind="container"} < 129600))
          - name: "SLSA provenance"
            go_min: 1
            no_go_max: 0
            query: |
              min(rp_sec_supply_chain_control{app="hello-world",control="provenance"}
                and on(app) (time() - rp_sec_scan_timestamp_seconds{app="hello-world",kind="container"} < 129600))
      # Security gate (cannot be overridden): every version entering test, acc
      # or prod needs all six scan kinds — SAST, SCA, secrets, image CVEs,
      # IaC/CIS and licences — with no critical or high finding left unwaived.
      # Scans older than 30 days count as stale — the nightly run refreshes
      # them for the version currently on main.
      security:
        rings: [test, acc, prod]
        require: [sast, sca, secrets, container, iac, license]
        max: { critical: 0, high: 0 }
        max_age: 720h
      # Compliance: a named release engineer records GO for the exact version
      # before it may enter prod (four-eyes, audited alongside the gate log).
      qa_signoff:
        rings: [prod]
    rings:
      int:  { namespace: hello-world-int,  deployment: hello-world, container: hello-world, image: docker.io/bwalia/rp-training-hello-world, health_url: "http://hello-world.hello-world-int.svc.cluster.local/healthz",  health_version_field: version }
      test: { namespace: hello-world-test, deployment: hello-world, container: hello-world, image: docker.io/bwalia/rp-training-hello-world, health_url: "http://hello-world.hello-world-test.svc.cluster.local/healthz", health_version_field: version }
      acc:  { namespace: hello-world-acc,  deployment: hello-world, container: hello-world, image: docker.io/bwalia/rp-training-hello-world, health_url: "http://hello-world.hello-world-acc.svc.cluster.local/healthz",  health_version_field: version }
      prod: { namespace: hello-world-prod, deployment: hello-world, container: hello-world, image: docker.io/bwalia/rp-training-hello-world, health_url: "http://hello-world.hello-world-prod.svc.cluster.local/healthz", health_version_field: version }

  # 2) kuard — canonical demo on a THIRD-PARTY image, STATUS-ONLY health check
