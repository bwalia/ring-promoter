name: iOS Release (TestFlight & App Store)

# Build, sign, and upload the native Ring Promoter iOS app.
#
#   PRIMARY   : workflow_dispatch — TestFlight internal by default
#   SECONDARY : push an ios-v*.*.* tag
#   APP STORE : workflow_dispatch with target = app_store (after TestFlight QA)
#
# Ported from the KubePilot pipeline (kubepilot/.github/workflows/ios_release.yml).
# Runs on the self-hosted Mac Studio runner. Signing secrets are loaded from
# HashiCorp Vault (secret/ring-promoter/ios) at build time — nothing stored in
# GitHub. The signing keychain is shared with KubePilot on purpose: both apps
# belong to the same Apple team, and reusing the keychain means fastlane `cert`
# reuses one Apple Distribution certificate instead of minting another
# (Apple caps distribution certs per team).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version override (blank = MARKETING_VERSION in the Xcode project)"
        required: false
        default: ""
      target:
        description: "Upload destination"
        required: true
        type: choice
        default: testflight
        options:
          - testflight
          - app_store
  push:
    tags:
      - "ios-v*.*.*"

concurrency:
  group: ringpromoter-ios-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: ios

jobs:
  release:
    name: Build & upload (${{ github.event_name == 'workflow_dispatch' && inputs.target || 'testflight' }})
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      VAULT_TOKEN_FILE: /Users/balinderwalia/.secrets/acc-vault/login-token.json
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # Publisher branding for the store listing and the App Review contact,
      # read by fastlane and by verify-app-store-readiness.sh. The same values
      # the web legal pages are built from, so the listing and the privacy
      # policy can never name different publishers. Repository *variables*, not
      # secrets — all of it ends up on the public listing. See web/.env.example.
      PUBLISHER: ${{ vars.PUBLISHER }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      JURISDICTION: ${{ vars.JURISDICTION }}
      POSTAL_ADDRESS: ${{ vars.POSTAL_ADDRESS }}
      REVIEW_FIRST_NAME: ${{ vars.REVIEW_FIRST_NAME }}
      REVIEW_LAST_NAME: ${{ vars.REVIEW_LAST_NAME }}
      REVIEW_PHONE: ${{ vars.REVIEW_PHONE }}
      REVIEW_EMAIL: ${{ vars.REVIEW_EMAIL }}
      COPYRIGHT: ${{ vars.COPYRIGHT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure build keychain
        run: |
          set -euo pipefail
          # Shared with KubePilot (same Apple team) so `cert` reuses the one
          # Apple Distribution certificate already in this keychain.
          pass_file="$HOME/.secrets/kubepilot/keychain-password"
          mkdir -p "$(dirname "$pass_file")"
          if [ ! -s "$pass_file" ]; then
            ( umask 077; openssl rand -base64 24 > "$pass_file" )
          fi
          kc_pass="$(cat "$pass_file")"
          echo "::add-mask::$kc_pass"
          {
            echo "BUILD_KEYCHAIN_PATH=$HOME/Library/Keychains/kubepilot-signing.keychain-db"
            echo "BUILD_KEYCHAIN_PASSWORD=$kc_pass"
            echo "EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions.plist"
          } >> "$GITHUB_ENV"

      - name: Load signing secrets from Vault
        run: |
          chmod +x ./ci/load-ios-vault-secrets.sh
          ./ci/load-ios-vault-secrets.sh

      - name: Install Ruby dependencies
        run: bundle install

      # Before the 15-minute build, not after it: every check here fails for a
      # reason that would otherwise be found by App Review (or by `deliver` at
      # upload time) once the archive already exists. Only gated on the App
      # Store path — a TestFlight build needs no store metadata or screenshots.
      - name: Verify App Store readiness
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'app_store'
        run: ./scripts/verify-app-store-readiness.sh --online

      - name: Resolve marketing version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            v="${GITHUB_REF_NAME#ios-v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          else
            v="$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' RingPromoter.xcodeproj/project.pbxproj | head -1)"
          fi
          echo "Resolved version: $v"
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"

      - name: Compute next build number
        id: build
        run: bundle exec fastlane ios ci_build_number

      - name: Prepare code signing
        run: bundle exec fastlane ios prepare_signing

      - name: Build signed IPA
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: bundle exec fastlane ios build_ipa

      - name: Upload to TestFlight (internal)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'testflight')
        run: bundle exec fastlane ios beta

      - name: Submit for App Store review
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'app_store'
        run: bundle exec fastlane ios release

      - name: Archive IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ringpromoter-ios-ipa
          path: ios/build/RingPromoter.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          # The signing keychain is intentionally persistent (see Configure build
          # keychain) — lock it rather than delete it so the cert survives.
          security lock-keychain "$BUILD_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$EXPORT_OPTIONS_PLIST" 2>/dev/null || true
          rm -f "${ASC_KEY_FILEPATH:-}" 2>/dev/null || true
          rm -f "${INSTALLED_PROFILE_PATH:-}" "${INSTALLED_WIDGET_PROFILE_PATH:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/*.cer "$RUNNER_TEMP"/*.p12 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/.ios-secrets" "${IOS_SECRETS_DIR:-}" 2>/dev/null || true
