name: CI

# Gates every pull request on the Go build, vet, and test suite, and on the
# Android app's unit tests.
# Build/test ONLY — deploy-k3s1.yml / deploy-training-k3s1.yml own images + rollout.
#
# Intentionally does NOT run on push to main: the PR already passed this gate,
# and a second CI job on the single self-hosted mac-studio runner only delays
# the deploy that actually ships the merge.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: [self-hosted, mac-studio]
    steps:
      - uses: actions/checkout@v4

      # Pin the toolchain. Never use check-latest on the self-hosted runner —
      # it phones home to go.dev and has hung for ~10 minutes, blocking every
      # queued deploy behind this one job.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || (echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' and commit the result" && exit 1)

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        if: always()
        run: go tool cover -func=coverage.out | tail -1

  android:
    name: android build & test
    runs-on: [self-hosted, mac-studio]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for the merge-base diff below.
          fetch-depth: 0

      # Gradle on the single self-hosted runner is slow enough to be worth
      # skipping when a PR cannot have broken it. Decided here rather than with
      # a top-level `paths:` filter, which would gate the Go job on the same
      # list and quietly stop testing the server.
      - name: Does this PR touch the Android app?
        id: scope
        working-directory: ${{ github.workspace }}
        env:
          # The base commit recorded when the pull_request event fired, NOT the
          # live tip of the base branch.
          #
          # Queued behind the Go job on the single self-hosted runner, this job
          # can start minutes after its own pull request has already merged. A
          # comparison against the branch tip then finds that main already
          # contains these changes, concludes nothing was touched, and skips.
          # That is not a hypothetical: it is how this check first shipped, and
          # the pull request it skipped was the one adding it.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Every uncertain case runs the tests. A skip has to be positively
          # justified, because a wrong skip is silent and a wrong run only
          # costs a minute.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Base commit ${BASE_SHA} not available — testing anyway."
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- android/ .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No android/ changes in this pull request — nothing to test."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "android/ changed since ${BASE_SHA} — running the unit tests."
          fi

      # Searched for rather than hardcoded. This job's first run died in half a
      # second on a JAVA_HOME copied from a laptop, which the runner does not
      # have.
      - name: Locate the Android toolchain
        if: steps.scope.outputs.changed == 'true'
        run: ./ci/locate-toolchain.sh

      # The 172 unit tests are the reason to trust a merge. PromotionRules is
      # among them: the rule that the UI never offers an illegal promotion is
      # tested in exactly one place, and until now nothing ran it before main.
      - name: Run unit tests
        if: steps.scope.outputs.changed == 'true'
        run: ./gradlew --no-daemon test

      # Deliberately not running scripts/verify-play-readiness.sh here: it
      # checks for the upload key and the Play service account, which only
      # exist after the release lane loads them from Vault. On a pull request
      # it would fail for a reason no pull request can fix.
      - name: Test report
        if: always() && steps.scope.outputs.changed == 'true'
        run: |
          set -eu
          find app/build/reports/tests -name index.html 2>/dev/null | while read -r r; do
            echo "report: $r"
          done
