name: CI

# Gates every pull request on the Go build, vet, and test suite.
# Build/test ONLY — deploy-k3s1.yml / deploy-training-k3s1.yml own images + rollout.
#
# Intentionally does NOT run on push to main: the PR already passed this gate,
# and a second CI job on the single self-hosted mac-studio runner only delays
# the deploy that actually ships the merge.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: [self-hosted, mac-studio]
    steps:
      - uses: actions/checkout@v4

      # Pin the toolchain. Never use check-latest on the self-hosted runner —
      # it phones home to go.dev and has hung for ~10 minutes, blocking every
      # queued deploy behind this one job.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || (echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' and commit the result" && exit 1)

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        if: always()
        run: go tool cover -func=coverage.out | tail -1
