name: Deploy landing page (GitHub Pages)

# Publishes the static landing page (web/src/app/landing) to GitHub Pages at
# https://ring-promoter-pages.fictionally.org/. Only the landing page is
# published — the console SPA needs the API server and is served by the Go
# binary instead.
#
# A custom domain serves from the root; a project page serves from /<repo>.
# Getting this wrong breaks every asset URL, so the domain is resolved at
# build time (CNAME file, then the Pages API) instead of hard-coding either
# form — the same pattern as the vantiq deploy.
#
# The build runs on the self-hosted mac-studio runner, not a GitHub-hosted
# one. It used to be GitHub-hosted so it would not queue behind cluster
# deploys, but the legal pages (/privacy, /terms, /support) are built from
# publisher details held in Vault, and the Vault token file only exists on
# that runner. Keeping the publisher identity in Vault — one source of truth
# shared with the iOS release — was judged worth the occasional queue.
# Only the build runs there. Packaging and deploying stay GitHub-hosted,
# because they need no Vault access and the Pages artifact action needs
# GNU tar, which macOS does not ship.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Self-hosted: this is where VAULT_TOKEN_FILE lives. See the note above.
    runs-on: [self-hosted, mac-studio]
    env:
      VAULT_TOKEN_FILE: /Users/balinderwalia/.secrets/acc-vault/login-token.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # In order: explicit override, the repo's own CNAME file, the Pages API.
      # Worked out in bash rather than a `${{ a && b || c }}` expression:
      # GitHub treats an empty string as falsy, so that idiom silently falls
      # through to the default in exactly the custom-domain case where the
      # base path must be "".
      - name: Resolve deploy domain and base path
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN_OVERRIDE: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          domain="$DOMAIN_OVERRIDE"
          if [ -z "$domain" ] && [ -f CNAME ]; then
            domain=$(tr -d '[:space:]' < CNAME)
          fi
          if [ -z "$domain" ]; then
            domain=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // empty' 2>/dev/null || true)
          fi

          if [ -n "$domain" ]; then
            echo "Custom domain: $domain (serving from root)"
            echo "PAGES_DOMAIN=$domain" >> "$GITHUB_ENV"
            echo "NEXT_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "Project page (serving from /${{ github.event.repository.name }})"
            echo "PAGES_DOMAIN=" >> "$GITHUB_ENV"
            echo "NEXT_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      # The legal pages (/privacy, /terms, /support) name the publisher, its
      # contact address and its postal address, and those come from Vault —
      # the same secret the iOS release reads, so the privacy policy and the
      # App Store listing can never name different companies. The build fails
      # loudly if one is missing rather than publishing a policy with a blank
      # publisher. See ci/load-branding-from-vault.sh and web/.env.example.
      - name: Load publisher branding from Vault
        run: ./ci/load-branding-from-vault.sh

      - name: Build static export
        working-directory: web
        env:
          NEXT_OUTPUT: export
        run: npx next build

      - name: Assemble landing-only site
        run: |
          mkdir site
          cp web/out/landing.html site/index.html
          cp web/out/404.html web/out/favicon.ico site/
          cp -R web/out/_next site/_next
          # Public assets (e.g. release screenshots) land at out/<dir>/;
          # copy them so /releases/*.png resolves on Pages.
          if [ -d web/out/releases ]; then
            cp -R web/out/releases site/releases
          fi
          # Standalone comparison page (web/public/compare) at /compare/.
          cp -R web/out/compare site/compare
          # Legal and support pages. Apple opens the privacy policy and support
          # URLs during App Store review and rejects a listing whose links
          # 404, so a missing page here blocks an iOS release — hence the
          # explicit loop that fails the build rather than a silent `|| true`.
          for page in privacy terms support; do
            if [ ! -f "web/out/$page.html" ]; then
              echo "::error::web/out/$page.html missing — the iOS listing links to /$page" >&2
              exit 1
            fi
            mkdir -p "site/$page"
            cp "web/out/$page.html" "site/$page/index.html"
          done
          # PWA files referenced by every page's <head> (manifest link,
          # apple-touch-icon) and the service worker registration.
          cp web/out/manifest.webmanifest web/out/sw.js web/out/apple-icon.png site/
          cp -R web/out/icons site/icons
          # Pages runs Jekyll by default, which drops _next/; opt out.
          touch site/.nojekyll
          # An Actions deploy replaces the whole site, so the CNAME has to be
          # part of the artifact or the custom domain binding is dropped.
          if [ -n "$PAGES_DOMAIN" ]; then
            echo "$PAGES_DOMAIN" > site/CNAME
          fi

      # A plain artifact, not a Pages one. actions/upload-pages-artifact shells
      # out to `gtar` on macOS, which this runner does not have — and installing
      # it would not be enough, because /opt/homebrew/bin is not on the PATH the
      # runner gives a step. actions/upload-artifact is pure JavaScript, so it
      # works here, and the `package` job below turns it into a Pages artifact
      # on a runner that does have GNU tar.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 1
          include-hidden-files: true

  # Everything this job does is GNU-tar and Pages plumbing; none of it needs
  # Vault, so it runs GitHub-hosted. Only the build above has to be on
  # mac-studio, because that is where the Vault token file lives.
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
