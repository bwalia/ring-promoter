name: Deploy landing page (GitHub Pages)

# Publishes the static landing page (web/src/app/landing) to GitHub Pages at
# https://ring-promoter-pages.fictionally.org/. Only the landing page is
# published — the console SPA needs the API server and is served by the Go
# binary instead.
#
# The custom domain serves from the domain root, so the build leaves
# NEXT_BASE_PATH unset (the old bwalia.github.io/ring-promoter subpath needed
# it; that URL now redirects to the custom domain). Runs on GitHub-hosted
# runners on purpose: it must not queue behind deploys on the single
# self-hosted mac-studio runner.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        env:
          NEXT_OUTPUT: export
        run: npx next build

      - name: Assemble landing-only site
        run: |
          mkdir site
          cp web/out/landing.html site/index.html
          cp web/out/404.html web/out/favicon.ico site/
          cp -R web/out/_next site/_next
          # Pages runs Jekyll by default, which drops _next/; opt out.
          touch site/.nojekyll
          # Keep the custom domain bound to the deployed site.
          cp CNAME site/CNAME

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
