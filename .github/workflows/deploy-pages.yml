name: Deploy landing page (GitHub Pages)

# Publishes the static landing page (web/src/app/landing) to GitHub Pages at
# https://ring-promoter-pages.fictionally.org/. Only the landing page is
# published — the console SPA needs the API server and is served by the Go
# binary instead.
#
# A custom domain serves from the root; a project page serves from /<repo>.
# Getting this wrong breaks every asset URL, so the domain is resolved at
# build time (CNAME file, then the Pages API) instead of hard-coding either
# form — the same pattern as the vantiq deploy. Runs on GitHub-hosted runners
# on purpose: it must not queue behind deploys on the single self-hosted
# mac-studio runner.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # In order: explicit override, the repo's own CNAME file, the Pages API.
      # Worked out in bash rather than a `${{ a && b || c }}` expression:
      # GitHub treats an empty string as falsy, so that idiom silently falls
      # through to the default in exactly the custom-domain case where the
      # base path must be "".
      - name: Resolve deploy domain and base path
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN_OVERRIDE: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          domain="$DOMAIN_OVERRIDE"
          if [ -z "$domain" ] && [ -f CNAME ]; then
            domain=$(tr -d '[:space:]' < CNAME)
          fi
          if [ -z "$domain" ]; then
            domain=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // empty' 2>/dev/null || true)
          fi

          if [ -n "$domain" ]; then
            echo "Custom domain: $domain (serving from root)"
            echo "PAGES_DOMAIN=$domain" >> "$GITHUB_ENV"
            echo "NEXT_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "Project page (serving from /${{ github.event.repository.name }})"
            echo "PAGES_DOMAIN=" >> "$GITHUB_ENV"
            echo "NEXT_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      # The legal pages (/privacy, /terms, /support) are built from these, so
      # the site can be published under a different company without a code
      # change. They are repository *variables*, not secrets: every value ends
      # up visible on the published pages. The build fails loudly if one is
      # missing rather than publishing a policy with a blank publisher — see
      # web/.env.example.
      - name: Build static export
        working-directory: web
        env:
          NEXT_OUTPUT: export
          PUBLISHER: ${{ vars.PUBLISHER }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          JURISDICTION: ${{ vars.JURISDICTION }}
          POSTAL_ADDRESS: ${{ vars.POSTAL_ADDRESS }}
          APP_NAME: ${{ vars.APP_NAME }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          GITHUB_URL: ${{ vars.GITHUB_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          LEGAL_LAST_UPDATED: ${{ vars.LEGAL_LAST_UPDATED }}
        run: npx next build

      - name: Assemble landing-only site
        run: |
          mkdir site
          cp web/out/landing.html site/index.html
          cp web/out/404.html web/out/favicon.ico site/
          cp -R web/out/_next site/_next
          # Public assets (e.g. release screenshots) land at out/<dir>/;
          # copy them so /releases/*.png resolves on Pages.
          if [ -d web/out/releases ]; then
            cp -R web/out/releases site/releases
          fi
          # Standalone comparison page (web/public/compare) at /compare/.
          cp -R web/out/compare site/compare
          # Legal and support pages. Apple opens the privacy policy and support
          # URLs during App Store review and rejects a listing whose links
          # 404, so a missing page here blocks an iOS release — hence the
          # explicit loop that fails the build rather than a silent `|| true`.
          for page in privacy terms support; do
            if [ ! -f "web/out/$page.html" ]; then
              echo "::error::web/out/$page.html missing — the iOS listing links to /$page" >&2
              exit 1
            fi
            mkdir -p "site/$page"
            cp "web/out/$page.html" "site/$page/index.html"
          done
          # PWA files referenced by every page's <head> (manifest link,
          # apple-touch-icon) and the service worker registration.
          cp web/out/manifest.webmanifest web/out/sw.js web/out/apple-icon.png site/
          cp -R web/out/icons site/icons
          # Pages runs Jekyll by default, which drops _next/; opt out.
          touch site/.nojekyll
          # An Actions deploy replaces the whole site, so the CNAME has to be
          # part of the artifact or the custom domain binding is dropped.
          if [ -n "$PAGES_DOMAIN" ]; then
            echo "$PAGES_DOMAIN" > site/CNAME
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
