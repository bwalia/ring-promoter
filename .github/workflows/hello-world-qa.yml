name: hello-world QA & AppSec (training)

# The evidence behind hello-world's promotion gates on the TRAINING instance
# (https://ring-promoter.fictionally.org):
#
#   1. QA        go vet + unit tests (race, coverage) -> Prometheus metrics,
#                pushed to the rp-qa Pushgateway on k3s1 and shown on
#                grafana.workstation.co.uk ("Ring Promoter — QA Unit Tests").
#                Ring Promoter's Grafana gate reads the same series.
#   2. AppSec    gosec (SAST), govulncheck (SCA), gitleaks (secrets) as SARIF,
#                uploaded to POST /api/security/scans for the exact version.
#   3. Release   build + push docker.io/bwalia/rp-training-hello-world:<version>
#                and seed it into int — only after 1 and 2 have been recorded,
#                so the gates judge this build, not the previous one.
#
# The version is sha-<7> of the LAST COMMIT THAT TOUCHED THE APP, not of HEAD:
# the nightly run then re-tests and re-scans the build that is actually
# promotable instead of minting a new version for an unrelated commit.
#
# Pull requests run 1 and 2 as checks but publish nothing: metrics and scans
# describe main. The nightly schedule keeps the QA signal inside the gate's 36h
# freshness window and the scans inside the 30-day max_age.
#
# Repo secrets used (all already set for the other training workflows):
#   KUBE_CONFIG_DATA_K3S1  push metrics (kubectl port-forward to the Pushgateway)
#   RP_URL / RP_TOKEN      training instance base URL + API token
#   DOCKER_USER / DOCKER_PASSWD   Docker Hub push

on:
  push:
    branches: [main]
    paths:
      - "training/sample-apps/hello-world/**"
      - "training/scripts/qa_unit_metrics.py"
      - ".github/workflows/hello-world-qa.yml"
  pull_request:
    paths:
      - "training/sample-apps/hello-world/**"
      - "training/scripts/qa_unit_metrics.py"
      - ".github/workflows/hello-world-qa.yml"
  schedule:
    - cron: "17 3 * * *"   # nightly, 03:17 UTC
  workflow_dispatch:
    inputs:
      seed:
        description: "Build the image and seed it into int"
        type: boolean
        default: true

concurrency:
  group: hello-world-qa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP: hello-world
  APP_DIR: training/sample-apps/hello-world
  IMAGE: docker.io/bwalia/rp-training-hello-world
  # Must equal the Dockerfile's golang:<version>-alpine base. govulncheck judges
  # the standard library of the toolchain it runs on, and the self-hosted
  # runner's cached "1.26.x" was 1.26.5 — 22 stdlib CVEs the image (built on a
  # newer patch) did not have. Pinned in both places, the scan describes the
  # binary that ships; when new stdlib CVEs land, the nightly scan turns the
  # AppSec gate NO-GO until both pins are bumped together.
  GO_VERSION: "1.26.10"
  GOSEC_VERSION: v2.22.4
  GOVULNCHECK_VERSION: v1.1.4
  GITLEAKS_VERSION: v8.30.1
  # Publish (metrics + scans) for main only — never for a PR.
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  qa:
    name: Unit tests + AppSec scans
    runs-on: [self-hosted, mac-studio]
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tests_ok: ${{ steps.test.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git log -- <app dir> needs history

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false   # stdlib-only module: no go.sum to key a cache on

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          sha=$(git log -1 --format=%H -- "$APP_DIR" | cut -c1-7)
          echo "version=sha-${sha}" >> "$GITHUB_OUTPUT"
          echo "VERSION=sha-${sha}" >> "$GITHUB_ENV"
          echo "APP_COMMIT=$(git log -1 --format=%H -- "$APP_DIR")" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/qa" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/qa"
          echo "### hello-world \`sha-${sha}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: go vet
        working-directory: ${{ env.APP_DIR }}
        run: go vet ./...

      # Never fails the step: the result is recorded first (a red run must
      # reach Grafana so the gate turns NO-GO), and the job fails at the end.
      - name: Unit tests
        id: test
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -uo pipefail
          go test -json -race -count=1 -coverprofile="$OUT/cover.out" ./... > "$OUT/test.json"
          rc=$?
          python3 "$GITHUB_WORKSPACE/training/scripts/qa_unit_metrics.py" \
            --app "$APP" --json "$OUT/test.json" --cover "$OUT/cover.out" \
            --version "$VERSION" --commit "$APP_COMMIT" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "$OUT/metrics.prom" 2> "$OUT/summary.txt"
          cat "$OUT/summary.txt"
          echo "- QA: $(cat "$OUT/summary.txt")" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish QA metrics to the Pushgateway
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          umask 077
          echo "${{ secrets.KUBE_CONFIG_DATA_K3S1 }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n rp-qa port-forward svc/rp-qa-pushgateway 19091:9091 >/dev/null 2>&1 &
          PF_PID=$!; trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null http://127.0.0.1:19091/-/ready 2>/dev/null && break
            sleep 1
          done
          # PUT replaces the whole group, so a deleted test disappears.
          curl -fsS -X PUT --data-binary "@$OUT/metrics.prom" \
            "http://127.0.0.1:19091/metrics/job/rp-qa-unit/app/${APP}"
          echo "pushed $(grep -c '^rp_qa_unit' "$OUT/metrics.prom") samples for ${APP} ${VERSION}"

      - name: SAST (gosec)
        working-directory: ${{ env.APP_DIR }}
        run: |
          go run "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" \
            -quiet -no-fail -fmt sarif -out "$OUT/sast.sarif" ./...

      - name: SCA (govulncheck)
        working-directory: ${{ env.APP_DIR }}
        run: |
          go version
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" \
            -format sarif ./... > "$OUT/sca.sarif"

      - name: Secrets (gitleaks)
        run: |
          go run "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}" dir "$APP_DIR" \
            --no-banner --exit-code 0 --report-format sarif --report-path "$OUT/secrets.sarif"

      - name: Summarise scans
        run: |
          set -euo pipefail
          for kind in sast sca secrets; do
            f="$OUT/$kind.sarif"
            # gosec writes no file when it finds nothing to report.
            [ -s "$f" ] || echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"gosec"}},"results":[]}]}' > "$f"
            n=$(jq '[.runs[].results[]?] | length' "$f")
            echo "- ${kind}: $(jq -r '.runs[0].tool.driver.name' "$f") — ${n} finding(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload scans to Ring Promoter
        if: env.PUBLISH == 'true'
        env:
          RP_URL: ${{ secrets.RP_URL }}
          RP_TOKEN: ${{ secrets.RP_TOKEN }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for kind in sast sca secrets; do
            jq -n --arg app "$APP" --arg version "$VERSION" --arg kind "$kind" --arg url "$run_url" \
              --slurpfile sarif "$OUT/$kind.sarif" \
              '{app:$app, version:$version, kind:$kind, url:$url, sarif:$sarif[0]}' > "$OUT/$kind.body.json"
            curl -fsS -X POST "${RP_URL}/api/security/scans" \
              -H "Authorization: Bearer ${RP_TOKEN}" -H "Content-Type: application/json" \
              -H "X-Actor: github-actions" \
              --data-binary "@$OUT/$kind.body.json" \
              | jq -c '{kind, scanner, critical, high, medium, low}'
          done
          echo "- AppSec gate for ${VERSION}:" >> "$GITHUB_STEP_SUMMARY"
          for ring in test acc prod; do
            curl -fsS -H "Authorization: Bearer ${RP_TOKEN}" \
              "${RP_URL}/api/apps/${APP}/security/evaluate?version=${VERSION}&ring=${ring}" \
              | jq -r --arg r "$ring" '"  - \($r): \(.verdict) (\(.detail))"' | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hello-world-qa-evidence
          path: |
            ${{ runner.temp }}/qa/*.sarif
            ${{ runner.temp }}/qa/metrics.prom
            ${{ runner.temp }}/qa/test.json
            ${{ runner.temp }}/qa/cover.out
          retention-days: 30

      - name: Fail on red unit tests
        if: steps.test.outputs.ok != 'true'
        run: |
          echo "::error::hello-world unit tests failed — the QA gate now reads NO-GO."
          exit 1

  release:
    name: Build image + seed int
    needs: qa
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.seed))
    runs-on: [self-hosted, mac-studio]
    env:
      VERSION: ${{ needs.qa.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Check for an existing image
        id: image
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "${IMAGE}:${VERSION} already pushed."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}

      # The QA gate guards int too. Prometheus scrapes every 30s and the gate
      # reads a 5m window, so a just-fixed suite can still read the previous
      # NO-GO for a few minutes: retry a 409 (gate refusal) instead of failing.
      - name: Seed int via Ring Promoter
        env:
          RP_URL: ${{ secrets.RP_URL }}
          RP_TOKEN: ${{ secrets.RP_TOKEN }}
        run: |
          set -uo pipefail
          for i in $(seq 1 8); do
            code=$(curl -sS -o "$RUNNER_TEMP/seed.json" -w '%{http_code}' -X POST "${RP_URL}/api/apps/${APP}/seed" \
              -H "Authorization: Bearer ${RP_TOKEN}" -H "Content-Type: application/json" \
              -H "X-Actor: github-actions" \
              -d "$(jq -nc --arg v "$VERSION" '{ring:"int", version:$v}')")
            echo "seed attempt $i -> HTTP $code: $(cat "$RUNNER_TEMP/seed.json")"
            case "$code" in
              2*) echo "- Seeded ${VERSION} into int" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              409) sleep 45 ;;
              *) exit 1 ;;
            esac
          done
          echo "::error::int stayed gated for ${VERSION} — check the QA gate on ${RP_URL}/?app=${APP}"
          exit 1
