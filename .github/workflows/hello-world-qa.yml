name: hello-world QA, AppSec & compliance (training)

# The evidence behind hello-world's promotion gates on the TRAINING instance
# (https://ring-promoter.fictionally.org). Every result lands in two places:
#
#   * Prometheus (rp-qa Pushgateway on k3s1 -> obs Prometheus), shown on
#     grafana.workstation.co.uk and read by Ring Promoter's Grafana gate:
#       "Ring Promoter — QA Unit Tests"           rp_qa_unit_*
#       "Ring Promoter — Security & Compliance"   rp_sec_*
#   * Ring Promoter itself, as SARIF per exact version (POST /api/security/
#     scans), which its non-overridable AppSec gate judges.
#
# All open source:
#
#   job qa (source)        go vet + go test (race, coverage)      QA
#                          gosec + Semgrep (p/golang, p/dockerfile)  SAST
#                          govulncheck (reachability-aware)       SCA
#                          gitleaks                               secrets
#                          Checkov (CIS Docker + Kubernetes)      IaC / compliance
#   job supply-chain       buildx with SLSA provenance + SBOM attestations
#     (image)              Syft CycloneDX SBOM                    SBOM
#                          Grype on that SBOM                     container CVEs
#                          SpectonCR (acc registry, OSV)          container CVEs
#                          licence policy on that SBOM            licences
#                          then seed int (push / dispatch only)
#
# The version is sha-<7> of the LAST COMMIT THAT TOUCHED THE APP, not of HEAD:
# the nightly run re-tests and re-scans the build that is actually promotable
# (new CVEs published overnight turn its gate NO-GO) instead of minting a new
# version for an unrelated commit.
#
# Pull requests run the source job as a check and fail on any blocking finding
# (shift left), but publish nothing: metrics and scans describe main.
#
# Repo secrets used (all already set for the other training workflows):
#   KUBE_CONFIG_DATA_K3S1  push metrics (kubectl port-forward to the Pushgateway)
#   RP_URL / RP_TOKEN      training instance base URL + API token
#   DOCKER_USER / DOCKER_PASSWD   Docker Hub push
#   SPECTONCR_USER / SPECTONCR_PASSWORD  acc SpectonCR push+pull (CVE scan;
#                                 skipped with a warning when unset)

on:
  push:
    branches: [main]
    paths:
      - "training/sample-apps/hello-world/**"
      - "training/scripts/qa_unit_metrics.py"
      - "training/scripts/sec_metrics.py"
      - "training/scripts/cve_metrics.py"
      - "training/scripts/spectoncr_scan.sh"
      - ".github/workflows/hello-world-qa.yml"
  pull_request:
    paths:
      - "training/sample-apps/hello-world/**"
      - "training/scripts/qa_unit_metrics.py"
      - "training/scripts/sec_metrics.py"
      - ".github/workflows/hello-world-qa.yml"
  schedule:
    - cron: "17 3 * * *"   # nightly, 03:17 UTC
  workflow_dispatch:
    inputs:
      seed:
        description: "Build the image (if missing) and seed it into int"
        type: boolean
        default: true

concurrency:
  group: hello-world-qa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP: hello-world
  APP_DIR: training/sample-apps/hello-world
  IMAGE: docker.io/bwalia/rp-training-hello-world
  # Must equal the Dockerfile's golang:<version>-alpine base. govulncheck judges
  # the standard library of the toolchain it runs on, and the self-hosted
  # runner's cached "1.26.x" was 1.26.5 — 22 stdlib CVEs the image (built on a
  # newer patch) did not have. Pinned in both places, the scan describes the
  # binary that ships; when new stdlib CVEs land, the nightly scans turn the
  # AppSec gate NO-GO until both pins are bumped together.
  GO_VERSION: "1.26.10"
  # Scanner versions are pinned so a verdict change always means the code or
  # the vulnerability data changed, never the tool.
  GOSEC_VERSION: v2.22.4
  GOVULNCHECK_VERSION: v1.1.4
  GITLEAKS_VERSION: v8.30.1
  SEMGREP_IMAGE: docker.io/semgrep/semgrep:1.181.1
  CHECKOV_IMAGE: docker.io/bridgecrew/checkov:3.3.28
  SYFT_IMAGE: docker.io/anchore/syft:v1.54.0
  GRYPE_IMAGE: docker.io/anchore/grype:v0.120.0
  SPECTONCR_REGISTRY: acc-spectoncr.diytaxreturn.co.uk
  # Publish (metrics + scans) for main only — never for a PR.
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  qa:
    name: Unit tests + source security
    runs-on: [self-hosted, mac-studio]
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git log -- <app dir> needs history

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false   # stdlib-only module: no go.sum to key a cache on

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          commit=$(git log -1 --format=%H -- "$APP_DIR")
          {
            echo "VERSION=sha-${commit:0:7}"
            echo "APP_COMMIT=${commit}"
            echo "OUT=$RUNNER_TEMP/qa"
            echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"
          echo "version=sha-${commit:0:7}" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/qa" && mkdir -p "$RUNNER_TEMP/qa"
          echo "### hello-world \`sha-${commit:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Kubeconfig (k3s1)
        if: env.PUBLISH == 'true'
        run: |
          umask 077
          echo "${{ secrets.KUBE_CONFIG_DATA_K3S1 }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: go vet
        working-directory: ${{ env.APP_DIR }}
        run: go vet ./...

      # Never fails the step: the result is recorded first (a red run must
      # reach Grafana so the gate turns NO-GO), and the job fails at the end.
      - name: Unit tests
        id: test
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -uo pipefail
          go test -json -race -count=1 -coverprofile="$OUT/cover.out" ./... > "$OUT/test.json"
          rc=$?
          python3 "$GITHUB_WORKSPACE/training/scripts/qa_unit_metrics.py" \
            --app "$APP" --json "$OUT/test.json" --cover "$OUT/cover.out" \
            --version "$VERSION" --commit "$APP_COMMIT" --run-url "$RUN_URL" \
            > "$OUT/qa.prom" 2> "$OUT/qa.txt"
          cat "$OUT/qa.txt"
          echo "- QA: $(cat "$OUT/qa.txt")" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: SAST — gosec
        working-directory: ${{ env.APP_DIR }}
        run: |
          go run "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" \
            -quiet -no-fail -fmt sarif -out "$OUT/gosec.sarif" ./...
          # gosec writes no file when it has nothing to report.
          [ -s "$OUT/gosec.sarif" ] || echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"gosec"}},"results":[]}]}' > "$OUT/gosec.sarif"

      # The Docker-based scanners get the source as a tar on stdin and hand
      # results back the same way: no bind mounts, so it works whatever the
      # runner's Docker file-sharing allows.
      - name: SAST — Semgrep
        run: |
          set -euo pipefail
          tar -C "$APP_DIR" -cf - . | docker run --rm -i --entrypoint sh "$SEMGREP_IMAGE" -c \
            'mkdir -p /tmp/src && tar -xf - -C /tmp/src && cd /tmp/src &&
             semgrep scan --config p/golang --config p/dockerfile --sarif --metrics=off --quiet .' \
            > "$OUT/semgrep.sarif"

      - name: SCA — govulncheck
        working-directory: ${{ env.APP_DIR }}
        run: |
          go version
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" \
            -format sarif ./... > "$OUT/govulncheck.sarif"

      - name: Secrets — gitleaks
        run: |
          go run "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}" dir "$APP_DIR" \
            --no-banner --exit-code 0 --report-format sarif --report-path "$OUT/gitleaks.sarif"

      # CIS Docker + Kubernetes benchmarks over the Dockerfile and Helm chart.
      # Exceptions live in the app's .checkov.yaml, each with its reason.
      - name: IaC compliance — Checkov
        run: |
          set -euo pipefail
          mkdir -p "$OUT/checkov"
          tar -C "$APP_DIR" -cf - . | docker run --rm -i --entrypoint sh "$CHECKOV_IMAGE" -c \
            'mkdir -p /src /out && tar -xf - -C /src &&
             checkov --config-file /src/.checkov.yaml -d /src --quiet \
               -o json -o sarif --output-file-path /out >/dev/null 2>&1;
             tar -C /out -cf - .' \
            | tar -xf - -C "$OUT/checkov"
          test -s "$OUT/checkov/results_sarif.sarif"

      - name: Security metrics (source)
        id: sec
        run: |
          set -euo pipefail
          python3 training/scripts/sec_metrics.py --app "$APP" --stage source \
            --version "$VERSION" --commit "$APP_COMMIT" --run-url "$RUN_URL" \
            --sarif "sast=$OUT/gosec.sarif" --sarif "sast=$OUT/semgrep.sarif" \
            --sarif "sca=$OUT/govulncheck.sarif" --sarif "secrets=$OUT/gitleaks.sarif" \
            --sarif "iac=$OUT/checkov/results_sarif.sarif" \
            --checkov-json "$OUT/checkov/results_json.json" \
            --checkov-config "$APP_DIR/.checkov.yaml" \
            > "$OUT/sec-source.prom" 2> "$OUT/sec-source.txt"
          sed 's/^/- /' "$OUT/sec-source.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          score=$(awk '/^rp_sec_compliance_score_percent/ {print $2}' "$OUT/sec-source.prom")
          echo "- CIS compliance: ${score}%" | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q 'NO-GO' "$OUT/sec-source.txt"; then echo "blocking=true" >> "$GITHUB_OUTPUT"; else echo "blocking=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish metrics to the Pushgateway
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          kubectl -n rp-qa port-forward svc/rp-qa-pushgateway 19091:9091 >/dev/null 2>&1 &
          PF_PID=$!; trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 10); do
            curl -fsS -o /dev/null http://127.0.0.1:19091/-/ready 2>/dev/null && break
            sleep 1
          done
          # PUT replaces the whole group, so a deleted test or a fixed finding
          # disappears instead of lingering.
          gw=http://127.0.0.1:19091/metrics/job
          curl -fsS -X PUT --data-binary "@$OUT/qa.prom" "$gw/rp-qa-unit/app/${APP}"
          curl -fsS -X PUT --data-binary "@$OUT/sec-source.prom" "$gw/rp-sec/app/${APP}/stage/source"
          echo "pushed QA + source-security metrics for ${APP} ${VERSION}"

      - name: Upload source scans to Ring Promoter
        if: env.PUBLISH == 'true'
        env:
          RP_URL: ${{ secrets.RP_URL }}
          RP_TOKEN: ${{ secrets.RP_TOKEN }}
        run: |
          set -euo pipefail
          upload() {  # kind file
            jq -n --arg app "$APP" --arg version "$VERSION" --arg kind "$1" --arg url "$RUN_URL" \
              --slurpfile sarif "$2" '{app:$app, version:$version, kind:$kind, url:$url, sarif:$sarif[0]}' \
              | curl -fsS -X POST "${RP_URL}/api/security/scans" \
                  -H "Authorization: Bearer ${RP_TOKEN}" -H "Content-Type: application/json" \
                  -H "X-Actor: github-actions" --data-binary @- \
              | jq -c '{kind, scanner, critical, high, medium, low}'
          }
          upload sast "$OUT/gosec.sarif"
          upload sast "$OUT/semgrep.sarif"
          upload sca "$OUT/govulncheck.sarif"
          upload secrets "$OUT/gitleaks.sarif"
          upload iac "$OUT/checkov/results_sarif.sarif"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hello-world-source-evidence
          path: ${{ runner.temp }}/qa
          retention-days: 30

      - name: Fail on red unit tests
        if: steps.test.outputs.ok != 'true'
        run: |
          echo "::error::hello-world unit tests failed — the QA gate now reads NO-GO."
          exit 1

      - name: Fail a PR on blocking findings
        if: github.event_name == 'pull_request' && steps.sec.outputs.blocking == 'true'
        run: |
          echo "::error::critical/high security findings — fix or waive before merging (see the job summary)."
          exit 1

  supply-chain:
    name: Image SBOM, CVEs, licences + seed
    needs: qa
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, mac-studio]
    env:
      VERSION: ${{ needs.qa.outputs.version }}
      # Build only when a merge or a human asked for a release; the nightly run
      # re-scans an image that already exists and never builds one.
      CAN_BUILD: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.seed) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare
        run: |
          set -euo pipefail
          {
            echo "OUT=$RUNNER_TEMP/sc"
            echo "APP_COMMIT=$(git log -1 --format=%H -- "$APP_DIR")"
            echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig"
          } >> "$GITHUB_ENV"
          rm -rf "$RUNNER_TEMP/sc" && mkdir -p "$RUNNER_TEMP/sc"
          umask 077
          echo "${{ secrets.KUBE_CONFIG_DATA_K3S1 }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Check for an existing image
        id: image
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "${IMAGE}:${VERSION} already pushed."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # SLSA provenance (mode=max) and an SPDX SBOM are attached to the image
      # as attestations, so anyone pulling it can verify how and from what it
      # was built — not just read our CI logs.
      - name: Build & push (with provenance + SBOM attestations)
        if: steps.image.outputs.exists != 'true' && env.CAN_BUILD == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Resolve image
        id: ref
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${IMAGE}:${VERSION} has not been built yet — nothing to scan (a merge or a dispatch builds it)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SBOM — Syft (CycloneDX)
        if: steps.ref.outputs.ok == 'true'
        run: |
          set -euo pipefail
          docker run --rm "$SYFT_IMAGE" "registry:${IMAGE}:${VERSION}" --platform linux/amd64 \
            -o cyclonedx-json -q > "$OUT/sbom.cdx.json"
          echo "- SBOM: $(jq '.components | length' "$OUT/sbom.cdx.json") components" | tee -a "$GITHUB_STEP_SUMMARY"

      # Grype's vulnerability DB lives in a named volume so the nightly run
      # only downloads updates.
      - name: Container CVEs — Grype
        if: steps.ref.outputs.ok == 'true'
        run: |
          set -euo pipefail
          docker run --rm -i -e GRYPE_DB_CACHE_DIR=/grype-db -v rp-grype-db:/grype-db \
            "$GRYPE_IMAGE" -o sarif -q < "$OUT/sbom.cdx.json" > "$OUT/grype.sarif"
          docker run --rm -i -e GRYPE_DB_CACHE_DIR=/grype-db -v rp-grype-db:/grype-db \
            "$GRYPE_IMAGE" -o json -q < "$OUT/sbom.cdx.json" > "$OUT/grype.json"

      # The CVE policy view ("Ring Promoter — CVE Scans"): SpectonCR scans the
      # image pushed to its registry, Grype is shown beside it. Only the
      # SpectonCR result is uploaded to Ring Promoter here — Grype's already
      # is, as SARIF, above.
      - name: Container CVEs — SpectonCR + CVE metrics
        id: spectoncr
        if: steps.ref.outputs.ok == 'true'
        env:
          SPECTONCR_USER: ${{ secrets.SPECTONCR_USER }}
          SPECTONCR_PASSWORD: ${{ secrets.SPECTONCR_PASSWORD }}
        run: |
          set -euo pipefail
          args=(--grype "$OUT/grype.json")
          report=""
          if [ -n "${SPECTONCR_USER}" ] && [ -n "${SPECTONCR_PASSWORD}" ]; then
            training/scripts/spectoncr_scan.sh "${IMAGE}:${VERSION}" "$APP" "$VERSION" "$OUT/spectoncr.json" > "$OUT/spectoncr.meta"
            report=$(sed -n 's/^report_url=//p' "$OUT/spectoncr.meta")
            args+=(--spectoncr "$OUT/spectoncr.json")
          else
            echo "::warning::SPECTONCR_USER / SPECTONCR_PASSWORD not set — SpectonCR scan skipped."
          fi
          python3 training/scripts/cve_metrics.py --app "$APP" --version "$VERSION" --image "${IMAGE}:${VERSION}" \
            "${args[@]}" --report-url "$report" --run-url "$RUN_URL" --rp-dir "$OUT/rp" \
            > "$OUT/cve.prom" 2> "$OUT/cve.txt"
          sed 's/^/- /' "$OUT/cve.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Supply-chain controls
        if: steps.ref.outputs.ok == 'true'
        run: |
          set -euo pipefail
          has() {  # field -> 1 when the image index carries that attestation
            v=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format "{{json .$1}}" 2>/dev/null || true)
            case "$v" in ""|null|"{}") echo 0 ;; *) echo 1 ;; esac
          }
          echo "PROVENANCE=$(has Provenance)" >> "$GITHUB_ENV"
          echo "SBOM_ATTESTATION=$(has SBOM)" >> "$GITHUB_ENV"

      - name: Security metrics (image) + licence policy
        if: steps.ref.outputs.ok == 'true'
        run: |
          set -euo pipefail
          python3 training/scripts/sec_metrics.py --app "$APP" --stage image \
            --version "$VERSION" --commit "$APP_COMMIT" --run-url "$RUN_URL" \
            --sbom "$OUT/sbom.cdx.json" --license-sarif-out "$OUT/license.sarif" \
            --sarif "container=$OUT/grype.sarif" \
            --control "provenance=${PROVENANCE}" --control "sbom_attestation=${SBOM_ATTESTATION}" \
            > "$OUT/sec-image.prom" 2> "$OUT/sec-image.txt"
          sed 's/^/- /' "$OUT/sec-image.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- provenance attestation: ${PROVENANCE}, SBOM attestation: ${SBOM_ATTESTATION}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish image metrics to the Pushgateway
        if: steps.ref.outputs.ok == 'true'
        run: |
          set -euo pipefail
          kubectl -n rp-qa port-forward svc/rp-qa-pushgateway 19091:9091 >/dev/null 2>&1 &
          PF_PID=$!; trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 10); do
            curl -fsS -o /dev/null http://127.0.0.1:19091/-/ready 2>/dev/null && break
            sleep 1
          done
          curl -fsS -X PUT --data-binary "@$OUT/sec-image.prom" \
            "http://127.0.0.1:19091/metrics/job/rp-sec/app/${APP}/stage/image"
          curl -fsS -X PUT --data-binary "@$OUT/cve.prom" \
            "http://127.0.0.1:19091/metrics/job/rp-cve/app/${APP}"

      - name: Upload image scans to Ring Promoter
        if: steps.ref.outputs.ok == 'true'
        env:
          RP_URL: ${{ secrets.RP_URL }}
          RP_TOKEN: ${{ secrets.RP_TOKEN }}
        run: |
          set -euo pipefail
          upload() {  # kind file
            jq -n --arg app "$APP" --arg version "$VERSION" --arg kind "$1" --arg url "$RUN_URL" \
              --slurpfile sarif "$2" '{app:$app, version:$version, kind:$kind, url:$url, sarif:$sarif[0]}' \
              | curl -fsS -X POST "${RP_URL}/api/security/scans" \
                  -H "Authorization: Bearer ${RP_TOKEN}" -H "Content-Type: application/json" \
                  -H "X-Actor: github-actions" --data-binary @- \
              | jq -c '{kind, scanner, critical, high, medium, low}'
          }
          upload container "$OUT/grype.sarif"
          upload license "$OUT/license.sarif"
          if [ -s "$OUT/rp/spectoncr.json" ]; then
            curl -fsS -X POST "${RP_URL}/api/security/scans" \
              -H "Authorization: Bearer ${RP_TOKEN}" -H "Content-Type: application/json" \
              -H "X-Actor: github-actions" --data-binary "@$OUT/rp/spectoncr.json" \
              | jq -c '{kind, scanner, critical, high, medium, low}'
          fi
          echo "- AppSec gate for ${VERSION}:" >> "$GITHUB_STEP_SUMMARY"
          for ring in test acc prod; do
            curl -fsS -H "Authorization: Bearer ${RP_TOKEN}" \
              "${RP_URL}/api/apps/${APP}/security/evaluate?version=${VERSION}&ring=${ring}" \
              | jq -r --arg r "$ring" '"  - \($r): \(.verdict) (\(.detail))"' | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hello-world-image-evidence
          path: ${{ runner.temp }}/sc
          retention-days: 90   # the SBOM is release evidence; keep it longer

      # The QA gate guards int too. Prometheus scrapes every 30s and the gate
      # reads a 5m window, so a just-fixed suite can still read the previous
      # NO-GO for a few minutes: retry a 409 (gate refusal) instead of failing.
      - name: Seed int via Ring Promoter
        if: steps.ref.outputs.ok == 'true' && env.CAN_BUILD == 'true'
        env:
          RP_URL: ${{ secrets.RP_URL }}
          RP_TOKEN: ${{ secrets.RP_TOKEN }}
        run: |
          set -uo pipefail
          for i in $(seq 1 8); do
            code=$(curl -sS -o "$RUNNER_TEMP/seed.json" -w '%{http_code}' -X POST "${RP_URL}/api/apps/${APP}/seed" \
              -H "Authorization: Bearer ${RP_TOKEN}" -H "Content-Type: application/json" \
              -H "X-Actor: github-actions" \
              -d "$(jq -nc --arg v "$VERSION" '{ring:"int", version:$v}')")
            echo "seed attempt $i -> HTTP $code: $(cat "$RUNNER_TEMP/seed.json")"
            case "$code" in
              2*) echo "- Seeded ${VERSION} into int" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              409) sleep 45 ;;
              *) exit 1 ;;
            esac
          done
          echo "::error::int stayed gated for ${VERSION} — check the gates on ${RP_URL}/?app=${APP}"
          exit 1
